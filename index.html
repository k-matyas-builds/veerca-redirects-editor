  function wordmark(cls) {
    return '<svg class="wordmark ' + cls + '" viewBox="-3 -13 138 41" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M0 0 9 24 18 0"/><path d="M38 0H25v24h13M25 12h10"/><path d="M58 0H45v24h13M45 12h10"/>' +
      '<path d="M65 24V0h7.5a6 6 0 0 1 0 12H65M71.5 12l7 12"/><path d="M107.2 4.3A12 12 0 1 0 107.2 19.7"/>' +
      '<path class="hacek" d="M93.5 -9.5 98 -5.5 102.5 -9.5" stroke-width="3.4"/><path d="M114 24 123 0 132 24M117.4 15h11.2"/></svg>';
  }

  const STATUS_DESC = {
    301: 'Permanent. Browsers and search engines treat the new address as the page\u2019s real home.',
    302: 'Temporary. The old address stays the page\u2019s real home.',
    303: 'See other. Meant for form submissions; rarely right for vanity URLs.',
    307: 'Temporary, and the browser repeats the request method unchanged.',
    308: 'Permanent, and the browser repeats the request method unchanged.',
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  const state = {
    doc: null, ruleId: null, loadError: '', loading: false,
    q: '', scope: 'all', onlyProblems: false, selected: new Set(), pathFilter: '',
  };

  /* ================= the open file ================= */

  function recompute(ms) {
    ms.issues = C.analyze(ms.current);
    ms.byRule = new Map();
    for (const i of ms.issues) {
      i.isNew = !ms.baseline.has(i.key);
      if (!ms.byRule.has(i.ruleId)) ms.byRule.set(i.ruleId, []);
      ms.byRule.get(i.ruleId).push(i);
    }
    ms.dirty = C.snapshot(ms.current) !== ms.originalSnap;
  }

  function openDoc(text, fileName) {
    const { market, info } = C.importPolicy(text, fileName);
    const ms = {
      name: market.name, host: market.host, original: clone(market), current: clone(market),
      originalSnap: C.snapshot(market), exportedSnap: null,
      origById: new Map(market.rules.map((r) => [r.id, JSON.stringify(r)])),
      baseline: new Set(C.analyze(market).map((i) => i.key)), issues: [], byRule: new Map(), dirty: false,
    };
    recompute(ms);
    state.doc = { ms, info, fileName };
    state.ruleId = null; state.q = ''; state.onlyProblems = false; state.selected.clear(); state.pathFilter = '';
    state.loadError = '';
    renderAll();
    const notes = [];
    if (info.delimiter === ';') notes.push('This file uses semicolons, as Excel saves it in some regional settings. The export uses commas, like Veera\u2019s.');
    if (info.extraCols.length) notes.push('Columns the tool doesn\u2019t edit are kept as they are: ' + info.extraCols.join(', ') + '.');
    if (info.pinnedMoved) notes.push('The trailing-slash rule wasn\u2019t last in this file. The export puts it last, as Veera did.');
    if (notes.length) toast(notes.join(' '));
  }

  async function readZip(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('This zip file seems to be damaged.');
    let p = dv.getUint32(eocd + 16, true);
    const count = dv.getUint16(eocd + 10, true);
    for (let n = 0; n < count; n++) {
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      if (!/\.csv$/i.test(name) || /(^|\/)(__MACOSX|\.)/.test(name)) continue;
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      const data = new Uint8Array(buf, start, size);
      if (method === 0) return { name: name.split('/').pop(), bytes: data };
      if (method === 8) {
        const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
        return { name: name.split('/').pop(), bytes: new Uint8Array(out) };
      }
      throw new Error('This zip uses a compression method the tool can\u2019t read. Unzip it and open the CSV instead.');
    }
    throw new Error('There\u2019s no CSV file inside this zip.');
  }

  async function openFile(file, force) {
    if (!file) return;
    if (!force && unexported()) {
      confirmDialog('Open another file?', 'Your changes to ' + state.doc.ms.name + ' haven\u2019t been exported yet. Opening another file discards them.', 'Open file', () => openFile(file, true));
      return;
    }
    state.loading = true; renderAll();
    try {
      let bytes = new Uint8Array(await file.arrayBuffer()), name = file.name;
      if (/\.zip$/i.test(name) || (bytes[0] === 0x50 && bytes[1] === 0x4b)) ({ name, bytes } = await readZip(bytes.buffer));
      else if (/\.xlsx?$/i.test(name)) throw new Error('Excel workbooks can\u2019t be opened directly. In Excel, use Save As and choose \u201cCSV UTF-8\u201d, then open that file.');
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
      catch (e) { throw new Error('This file isn\u2019t saved as UTF-8, so accented characters would come out wrong. In Excel, use Save As and choose \u201cCSV UTF-8\u201d, then open it again.'); }
      state.loading = false;
      openDoc(text, name);
    } catch (e) {
      state.loading = false;
      if (state.doc) { renderAll(); toast(e.message, 'error'); }
      else { state.loadError = e.message; renderAll(); }
    }
  }

  const activeMs = () => (state.doc ? state.doc.ms : null);
  const activeRule = () => { const ms = activeMs(); return ms ? ms.current.rules.find((r) => r.id === state.ruleId) || null : null; };
  const ruleState = (ms, r) => (!ms.origById.has(r.id) ? 'new' : ms.origById.get(r.id) !== JSON.stringify(r) ? 'changed' : 'same');
  const newErrors = (ms) => ms.issues.filter((i) => i.isNew && i.severity === 'error');
  // Text typed but not applied yet counts as work too: paths in the "Add paths" box,
  // a path being edited, or a half-filled New rule form.
  function pendingInput() {
    const ta = document.getElementById('add-paths');
    if (ta && ta.value.trim()) return true;
    if (document.querySelector('.pl input.pl-edit')) return true;
    const nr = document.getElementById('nr-form');
    return !!nr && [...nr.querySelectorAll('input[type=text], textarea')].some((i) => i.name !== 'host' && i.value.trim());
  }
  // Checked fresh each time, so a change typed a split second before F5 still counts.
  const unexported = () => {
    const ms = activeMs();
    if (!ms) return false;
    const snap = C.snapshot(ms.current);
    return (snap !== ms.originalSnap && snap !== ms.exportedSnap) || pendingInput();
  };

  /* ================= rendering ================= */

  function renderAll() {
    $('#app').classList.toggle('welcome-mode', !state.doc && !state.loading);
    document.body.classList.toggle('is-welcome', !state.doc && !state.loading);
    document.title = state.doc ? state.doc.ms.name + ' \u2013 Veer\u010da' : 'Veer\u010da \u2013 Redirects Editor';
    renderSource();
    renderMain();
    syncThemeButtons();
  }

  function renderSource() {
    const el = $('#source');
    const d = state.doc;
    if (!d) { el.innerHTML = ''; return; }
    const parts = [];
    if (d.info.source === 'akamai') {
      parts.push('<span class="chip"><b>' + esc(d.info.policy) + '</b>' + (d.info.version ? 'version ' + esc(d.info.version) : '') + '</span>');
    } else parts.push('<span class="chip">' + esc(d.fileName) + '</span>');
    parts.push('<button class="btn" data-action="open-file">Open another file</button>');
    el.innerHTML = parts.join('');
  }

  function renderMain() {
    const main = $('#main');
    if (state.loading) { main.innerHTML = '<div class="center"><p class="loading"><span class="spinner"></span>Reading the file\u2026</p></div>'; return; }
    if (!state.doc) { main.innerHTML = startHTML(); return; }
    main.innerHTML =
      '<section class="market">' +
      '<div class="market-head" id="market-head"></div>' +
      '<div class="toolbar">' +
      '<label class="search">' + ICON.search + '<span class="visually-hidden">Search rules</span><input type="search" id="rule-search" placeholder="Search rules, paths or addresses" value="' + esc(state.q) + '" spellcheck="false"></label>' +
      '<div class="seg" role="radiogroup" aria-label="Search in">' +
      [['all', 'Everything'], ['name', 'Names'], ['path', 'Paths'], ['target', 'Addresses']]
        .map(([v, l]) => '<button role="radio" aria-checked="' + (state.scope === v) + '" data-action="scope" data-scope="' + v + '">' + l + '</button>').join('') +
      '</div>' +
      '<div class="seg" role="radiogroup" aria-label="Show">' +
      '<button role="radio" aria-checked="' + !state.onlyProblems + '" data-action="only-problems" data-on="">All rules</button>' +
      '<button role="radio" aria-checked="' + (state.onlyProblems === 'new') + '" data-action="only-problems" data-on="new">New problems</button>' +
      '<button role="radio" aria-checked="' + (state.onlyProblems === 'all') + '" data-action="only-problems" data-on="all">All problems</button>' +
      '</div></div>' +
      '<div class="split"><div class="glass list-panel"><div class="list-count" id="list-count"></div><div class="rule-list" id="rule-list" aria-label="Rules"></div></div>' +
      '<div class="glass-strong detail-panel"><div class="detail" id="detail"></div></div></div></section>';
    renderHead(); renderList(); renderDetail();
  }

  function startHTML() {
    return '<section class="welcome" id="welcome">' +
      '<button class="btn icon theme-btn w-theme" type="button" data-pref="auto">' + $('.topbar .theme-btn').innerHTML + '</button>' +
      '<div class="mark w-mark">' + ICON.mark + '</div>' +
      '<h1 class="visually-hidden">Veer\u010da, Redirects Editor</h1>' +
      wordmark('w-word') +
      '<p class="w-sub">Redirects Editor</p>' +
      '<div class="dropzone" data-action="open-file">' + ICON.tray +
      '<button class="btn primary lg" type="button" data-action="open-file">Select a policy from your computer</button>' +
      '<p class="dz-or">or drag the .zip or .csv file here</p></div>' +
      '<p class="form-msg" role="alert">' + esc(state.loadError) + '</p>' +
      '</section>';
  }



  function renderHead() {
    const ms = activeMs(), el = $('#market-head');
    if (!el) return;
    const rules = ms.current.rules;
    const paths = rules.reduce((n, r) => n + r.paths.length, 0);
    const fresh = ms.issues.filter((i) => i.isNew);
    const freshErr = fresh.some((i) => i.severity === 'error');
    const known = ms.issues.length - fresh.length;
    el.innerHTML =
      '<div class="mh-title"><h1>' + esc(ms.name) + '</h1><a href="https://' + esc(ms.host) + '" target="_blank" rel="noopener">' + esc(ms.host) + '</a>' +
      (state.doc.info.lastUpdate ? '<span class="mh-when">Version last updated ' + esc(fmtDate(state.doc.info.lastUpdate)) + '</span>' : '') + '</div>' +
      '<div class="mh-stats">' +
      '<div class="stat"><b>' + fmt(rules.length) + '</b><span>rules</span></div>' +
      '<div class="stat"><b>' + fmt(paths) + '</b><span>paths</span></div>' +
      '<button class="stat ' + (freshErr ? 'is-err' : fresh.length ? 'is-warn' : '') + '" data-action="show-problems" data-which="new"><b>' + fmt(fresh.length) + '</b><span>new problems</span></button>' +
      '<button class="stat" data-action="show-problems" data-which="all"><b>' + fmt(known) + '</b><span>already in the file</span></button>' +
      '</div>' +
      '<div class="mh-actions">' +
      '<button class="btn" data-action="new-rule">New rule</button>' +
      '<button class="btn primary" data-action="review"' + (ms.dirty ? '' : ' disabled') + '>Review and export</button>' +
      '</div>';
  }

  function visibleRules() {
    const ms = activeMs();
    let rules = C.exportOrder(ms.current.rules);
    const pos = new Map(rules.map((r, i) => [r.id, i + 1]));
    if (state.onlyProblems === 'new') rules = rules.filter((r) => (ms.byRule.get(r.id) || []).some((i) => i.isNew));
    else if (state.onlyProblems) rules = rules.filter((r) => ms.byRule.has(r.id));
    let q = state.q.trim().toLowerCase();
    if (!q) return { rows: rules.map((r) => ({ r })), pos };
    const qPath = q.replace(/^https?:\/\/[^/]+/, '').replace(/^www\.[^/]+/, '') || q;
    const rows = [];
    for (const r of rules) {
      let hit = false, pathHit = null;
      if ((state.scope === 'all' || state.scope === 'name') && r.name.toLowerCase().includes(q)) hit = true;
      if ((state.scope === 'all' || state.scope === 'target') && r.redirectURL.toLowerCase().includes(q)) hit = true;
      if (state.scope === 'all' || state.scope === 'path') {
        const p = r.paths.find((x) => x.toLowerCase().includes(qPath));
        if (p) { hit = true; pathHit = p; }
      }
      if (hit) rows.push({ r, pathHit, qPath });
    }
    return { rows, pos };
  }

  function shortTarget(r, ms) {
    const t = C.parseTarget(r.redirectURL);
    if (!r.redirectURL) return 'No redirect address yet';
    if (t && t.host && (t.host === ms.host.toLowerCase() || r.host.toLowerCase().split(/\s+/).includes(t.host))) return t.path + r.redirectURL.replace(/^[^?#]*/, '');
    return r.redirectURL;
  }

  function highlight(text, q) {
    const i = text.toLowerCase().indexOf(q);
    if (i < 0 || !q) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function renderList() {
    const ms = activeMs(), el = $('#rule-list');
    if (!el) return;
    const { rows, pos } = visibleRules();
    const total = ms.current.rules.length;
    $('#list-count').textContent = rows.length === total ? fmt(total) + ' rules, in the order Akamai checks them' : fmt(rows.length) + ' of ' + fmt(total) + ' rules';
    if (!rows.length) {
      el.innerHTML = '<p class="list-empty">' + (state.onlyProblems === 'new' && !state.q ? 'No new problems. Everything you\u2019ve changed checks out.' : state.onlyProblems && !state.q ? 'No problems in this market.' : 'No rules match. Try searching everything, or clear the search.') + '</p>';
      return;
    }
    const top = el.scrollTop;
    el.innerHTML = rows.map(({ r, pathHit, qPath }) => {
      const iss = ms.byRule.get(r.id) || [];
      const fresh = iss.filter((i) => i.isNew);
      const sev = fresh.some((i) => i.severity === 'error') ? 'error' : fresh.length ? 'warning' : iss.length ? 'known' : '';
      const st = ruleState(ms, r);
      return '<button class="rr' + (r.id === state.ruleId ? ' sel' : '') + '" data-action="select-rule" data-id="' + esc(r.id) + '"' + (r.id === state.ruleId ? ' aria-current="true"' : '') + '>' +
        '<span class="rr-pos">' + pos.get(r.id) + '</span>' +
        '<span class="rr-main"><span class="rr-name">' + (r.name ? esc(r.name) : '<em>Unnamed rule</em>') + '</span>' +
        '<span class="rr-target">' + esc(shortTarget(r, ms)) + '</span>' +
        (pathHit ? '<span class="rr-hit">' + highlight(pathHit, qPath) + '</span>' : '') + '</span>' +
        '<span class="rr-side">' +
        (r.statusCode !== 301 ? '<span class="tag' + (C.STATUS_CODES.includes(r.statusCode) ? '' : ' amber') + '">' + (r.statusCode || '?') + '</span>' : '') +
        (r.pinLast ? ICON.pin : '') +
        '<span class="rr-count" title="Paths">' + r.paths.length + '</span>' +
        (st !== 'same' ? '<span class="dot" title="' + (st === 'new' ? 'New rule' : 'Changed') + '"></span>' : '') +
        (sev ? '<span class="sev ' + sev + '" title="' + (sev === 'known' ? 'Has problems that were already in the file' : 'Has new problems') + '"></span>' : '') +
        '</span></button>';
    }).join('');
    el.scrollTop = top;
  }

  function renderDetail() {
    const ms = activeMs(), el = $('#detail');
    if (!el) return;
    const r = activeRule();
    if (!r) { el.innerHTML = '<div class="detail-empty"><p>Select a rule to see where it sends visitors.</p></div>'; return; }
    const ordered = C.exportOrder(ms.current.rules);
    const pos = ordered.indexOf(r) + 1;
    el.innerHTML =
      '<input type="text" class="d-name" data-field="name" value="' + esc(r.name) + '" placeholder="Rule name" aria-label="Rule name" spellcheck="false">' +
      '<div class="d-sub" id="d-sub">' + subLine(r, pos, ordered.length) + '</div>' +
      '<div id="d-route">' + routeHTML(r) + '</div>' +
      '<div id="d-problems">' + problemsHTML(r) + '</div>' +
      '<div class="d-section"><h2>Redirect</h2>' + fieldsHTML(r) + '</div>' +
      '<div class="d-section" id="d-paths">' + pathsHTML(r) + '</div>' +
      '<div class="d-foot" id="d-foot">' + footHTML(r) + '</div>';
  }

  function subLine(r, pos, total) {
    return 'Checked ' + fmt(pos) + ' of ' + fmt(total) + (r.pinLast ? ', and always kept last' : '');
  }

  function routeHTML(r) {
    const ms = activeMs();
    const ps = r.paths.filter((p) => p !== '');
    const shown = ps.length > 4 ? ps.slice(0, 3) : ps;
    const more = ps.length - shown.length;
    const chips = shown.map((p) => '<span class="pchip" title="' + esc(p) + '">' + esc(p) + '</span>');
    if (more) chips.push('<span class="pchip more">and ' + fmt(more) + ' more</span>');
    if (!chips.length) chips.push('<span class="pchip none">No paths yet</span>');
    const n = chips.length, rowH = 30, gap = 6, H = n * rowH + (n - 1) * gap, W = 76;
    const wires = chips.map((_, k) => {
      const y = k * (rowH + gap) + rowH / 2;
      return '<path d="M0 ' + y + ' C' + W * 0.5 + ' ' + y + ' ' + W * 0.45 + ' ' + H / 2 + ' ' + (W - 8) + ' ' + H / 2 + '"/>';
    }).join('');
    const svg = '<svg class="wires" viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" preserveAspectRatio="none" aria-hidden="true">' + wires +
      '<path class="head" d="M' + (W - 9) + ' ' + (H / 2 - 4.5) + ' L' + W + ' ' + H / 2 + ' L' + (W - 9) + ' ' + (H / 2 + 4.5) + 'Z"/></svg>';

    const t = C.parseTarget(r.redirectURL);
    let host, path, empty = false;
    if (r.regex) { host = 'Built from the pattern ' + r.regex; path = r.redirectURL || 'No address yet'; }
    else if (!r.redirectURL) { host = ''; path = 'No redirect address yet'; empty = true; }
    else if (t && t.host) { host = t.host; path = r.redirectURL.replace(/^(https?:\/\/)?[^/?#]+/i, '') || '/'; }
    else { host = t ? 'Same site' : ''; path = r.redirectURL; }
    const meta = [];
    meta.push(C.STATUS_CODES.includes(r.statusCode) ? r.statusCode + ' ' + C.STATUS_LABELS[r.statusCode] : 'No valid status code');
    meta.push(r.useQueryString ? 'Keeps query string' : 'Drops query string');
    if (r.caseSensitive) meta.push('Case-sensitive');
    const chain = (ms.byRule.get(r.id) || []).find((i) => i.type === 'chain');
    const next = chain
      ? '<div class="route-next">Then ' + esc(chain.nextStatus) + ' again to <span class="mono">' + esc(chain.nextTarget) + '</span>, by <button class="link" data-action="select-rule" data-id="' + esc(chain.otherId) + '">' + esc(ruleName(chain.otherId)) + '</button></div>'
      : '';
    return '<div class="route" aria-label="Where this rule sends visitors">' +
      '<div class="route-from">' + chips.join('') + '</div>' + svg +
      '<div class="route-to"><div class="rt-host">' + esc(host) + '</div><div class="rt-path' + (empty ? ' empty' : '') + '">' + esc(path) + '</div>' +
      '<div class="rt-meta">' + meta.map((m) => '<span>' + esc(m) + '</span>').join('') + '</div></div>' + next + '</div>';
  }

  function ruleName(id) {
    const r = activeMs().current.rules.find((x) => x.id === id);
    return r ? (r.name || 'Unnamed rule') : 'another rule';
  }

  const FIX_LABEL = {
    removePath: 'Remove this path', removeDuplicate: 'Remove the duplicate', removeEmpty: 'Remove empty entries',
    addScheme: 'Add https://', flatten: 'Send visitors straight to the final address',
  };

  function problemsHTML(r) {
    const ms = activeMs();
    const list = (ms.byRule.get(r.id) || []).slice().sort((a, b) => (b.isNew - a.isNew) || ((a.severity === 'error' ? 0 : 1) - (b.severity === 'error' ? 0 : 1)));
    if (!list.length) return '';
    return '<div class="problems">' + list.map((i) => {
      const actions = [];
      if (i.fix) actions.push('<button class="link" data-action="fix" data-key="' + esc(i.key) + '">' + FIX_LABEL[i.fix] + '</button>');
      if (i.otherId && i.type !== 'chain') actions.push('<button class="link" data-action="select-rule" data-id="' + esc(i.otherId) + '">Open \u201c' + esc(ruleName(i.otherId)) + '\u201d</button>');
      return '<div class="problem ' + i.severity + (i.isNew ? '' : ' known') + '"><span class="p-icon">' + ICON[i.severity] + '</span><div>' +
        '<p>' + esc(i.message) + '</p>' + (i.isNew ? '' : '<span class="p-tag">Already in the file you opened</span>') +
        (actions.length ? '<div class="p-actions">' + actions.join('') + '</div>' : '') + '</div></div>';
    }).join('') + '</div>';
  }

  function switchHTML(field, on, title, hint) {
    return '<label class="switch-row"><span class="sw-text"><span>' + title + '</span><small>' + hint + '</small></span>' +
      '<input type="checkbox" role="switch" data-toggle="' + field + '"' + (on ? ' checked' : '') + '><span class="sw" aria-hidden="true"></span></label>';
  }

  function fieldsHTML(r) {
    const ms = activeMs();
    const adv = !!(r.regex || r.query || r.scheme || r.matchURL);
    return '<label class="field"><span>Redirect address</span><input type="text" class="mono" data-field="redirectURL" value="' + esc(r.redirectURL) + '" placeholder="https://' + esc(ms.host) + '/\u2026" spellcheck="false"></label>' +
      '<div class="field"><span id="lbl-status">Status code</span><div><div class="seg" role="radiogroup" aria-labelledby="lbl-status">' +
      C.STATUS_CODES.map((c) => '<button role="radio" aria-checked="' + (r.statusCode === c) + '" data-action="set-status" data-code="' + c + '" title="' + C.STATUS_LABELS[c] + '">' + c + '</button>').join('') +
      '</div></div><div class="status-desc">' + esc(STATUS_DESC[r.statusCode] || 'This rule has no valid status code. Pick one above.') + '</div></div>' +
      '<label class="field"><span>Hosts</span><input type="text" class="mono" data-field="host" value="' + esc(r.host) + '" spellcheck="false">' +
      '<small class="hint">Separate several hosts with spaces. Leave it empty to match every host.</small></label>' +
      '<div class="switches">' +
      switchHTML('caseSensitive', r.caseSensitive, 'Case-sensitive paths', '/Cars and /cars count as different paths.') +
      switchHTML('useQueryString', r.useQueryString, 'Keep the visitor\u2019s query string', 'Anything after ? in the visited address is passed on.') +
      switchHTML('pinLast', r.pinLast, 'Always check this rule last', 'For catch-all rules that must run after every other rule.') +
      '</div>' +
      '<details class="adv"' + (adv ? ' open' : '') + '><summary>Advanced matching</summary><div class="adv-grid">' +
      '<label class="field"><span>Regex</span><input type="text" class="mono" data-field="regex" value="' + esc(r.regex) + '" spellcheck="false"></label>' +
      '<label class="field"><span>Query</span><input type="text" class="mono" data-field="query" value="' + esc(r.query) + '" spellcheck="false"></label>' +
      '<label class="field"><span>Scheme</span><input type="text" class="mono" data-field="scheme" value="' + esc(r.scheme) + '" spellcheck="false"></label>' +
      '<label class="field"><span>Match URL</span><input type="text" class="mono" data-field="matchURL" value="' + esc(r.matchURL) + '" spellcheck="false"></label>' +
      '</div></details>';
  }

  function pathsHTML(r) {
    const ms = activeMs();
    const flagged = new Map();
    for (const i of ms.byRule.get(r.id) || []) if (i.path && i.type !== 'chars') flagged.set(i.path, i.isNew ? i.severity : 'known');
    const f = state.pathFilter.trim().toLowerCase();
    const items = r.paths.map((p, idx) => ({ p, idx })).filter(({ p }) => !f || p.toLowerCase().includes(f));
    const sel = state.selected.size;
    return '<div class="paths-head"><h2>Paths <span class="count">' + fmt(r.paths.length) + '</span></h2>' +
      (r.paths.length > 12 ? '<label class="search">' + ICON.search + '<span class="visually-hidden">Filter paths</span><input type="search" id="path-filter" placeholder="Filter paths" value="' + esc(state.pathFilter) + '" spellcheck="false"></label>' : '') +
      '</div>' +
      '<div class="add-paths"><label class="visually-hidden" for="add-paths">Add paths</label><textarea id="add-paths" rows="1" placeholder="Add paths, one per line. Full ' + esc(ms.host) + ' addresses work too." spellcheck="false"></textarea>' +
      '<button class="btn" data-action="add-paths" disabled>Add</button></div>' +
      (sel ? '<div class="selbar"><span>' + C.plural(sel, 'path') + ' selected</span><button class="btn subtle" data-action="move-paths">Move to another rule</button><button class="btn danger" data-action="remove-selected">Remove</button><button class="btn subtle" data-action="clear-selection">Clear</button></div>' : '') +
      (items.length ? '<ul class="path-list">' + items.map(({ p, idx }) => {
        const fl = flagged.get(p);
        return '<li class="pl"><input type="checkbox" data-action="toggle-path" data-idx="' + idx + '" aria-label="Select ' + esc(p || 'empty entry') + '"' + (state.selected.has(idx) ? ' checked' : '') + '>' +
          '<button class="pl-text" data-action="edit-path" data-idx="' + idx + '" title="Edit path">' + (p === '' ? '<em>Empty entry</em>' : esc(p)) + '</button>' +
          (fl ? '<span class="sev ' + fl + '"></span>' : '') +
          '<button class="icon-btn small" data-action="remove-path" data-idx="' + idx + '" aria-label="Remove ' + esc(p || 'empty entry') + '">' + ICON.x + '</button></li>';
      }).join('') + '</ul>' : (r.paths.length ? '<p class="hint">No paths match the filter.</p>' : '<p class="hint">This rule has no paths yet. Add one above.</p>'));
  }

  function footHTML(r) {
    const st = ruleState(activeMs(), r);
    return (st === 'new' ? '<span class="note">New rule, not saved yet</span>' : st === 'changed' ? '<button class="btn subtle" data-action="revert-rule">Undo changes to this rule</button>' : '') +
      '<button class="btn danger" data-action="delete-rule">Delete rule</button>';
  }

  /* light refresh used while typing, so inputs keep focus */
  let refreshTimer = null;
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      const ms = activeMs(), r = activeRule();
      if (!ms || !ms.current) return;
      recompute(ms);
      renderHead(); renderList();
      if (r) {
        const ordered = C.exportOrder(ms.current.rules);
        const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        set('d-route', routeHTML(r)); set('d-problems', problemsHTML(r)); set('d-foot', footHTML(r));
        set('d-sub', subLine(r, ordered.indexOf(r) + 1, ordered.length));
      }
    }, 180);
  }

  /* full refresh after structural edits */
  function changed(keepPaths) {
    const ms = activeMs();
    recompute(ms);
    if (!keepPaths) state.selected.clear();
    const detail = $('#detail'), top = detail ? detail.scrollTop : 0;
    renderHead(); renderList(); renderDetail();
    if (detail) $('#detail').scrollTop = top;
  }

  function selectRule(id, focusList) {
    const ms = activeMs();
    if (!ms.current.rules.some((r) => r.id === id)) return;
    state.ruleId = id; state.selected.clear(); state.pathFilter = '';
    const { rows } = visibleRules();
    if (!rows.some((x) => x.r.id === id)) { state.q = ''; state.onlyProblems = false; renderMain(); }
    else {
      document.querySelectorAll('.rr.sel').forEach((x) => { x.classList.remove('sel'); x.removeAttribute('aria-current'); });
      const cur = document.querySelector('.rr[data-id="' + CSS.escape(id) + '"]');
      if (cur) { cur.classList.add('sel'); cur.setAttribute('aria-current', 'true'); }
      renderDetail();
    }
    $('#detail').scrollTop = 0;
    const row = document.querySelector('.rr[data-id="' + CSS.escape(id) + '"]');
    if (row) { row.scrollIntoView({ block: 'nearest' }); if (focusList) row.focus(); }
  }

  /* ================= toasts, files, dialogs ================= */

  let toastTimer = 0;
  function toast(message, kind, html) {
    const el = $('#toast');
    $('#toast-text').innerHTML = esc(message) + (html ? ' ' + html : '');
    el.dataset.kind = kind === 'error' ? 'error' : 'info';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, kind === 'error' ? 8000 : 4000);
  }
  function hideToast() { $('#toast').classList.remove('show'); }


  function download(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function openDialog(html, onMount, opts) {
    const d = document.createElement('dialog');
    d.innerHTML = '<div class="dlg">' + html + '</div>';
    document.body.appendChild(d);
    d.addEventListener('close', () => d.remove());
    d.addEventListener('click', (e) => {
      if (e.target === d && !(opts && opts.keepOnOutsideClick)) d.close();
      if (e.target.closest('[data-close]')) d.close();
    });
    d.showModal();
    if (onMount) onMount(d);
    return d;
  }

  function newRuleDialog() {
    const ms = activeMs();
    const seg = (name, opts) => '<div class="seg" role="radiogroup" data-name="' + name + '">' +
      opts.map(([v, l, t]) => '<button type="button" role="radio" aria-checked="false" data-value="' + v + '"' + (t ? ' title="' + t + '"' : '') + '>' + l + '</button>').join('') + '</div>';
    openDialog(
      '<h2>New rule</h2><p>It\u2019s added to the end of the list, before any rule that\u2019s always kept last.</p>' +
      '<form id="nr-form" class="dlg-body" autocomplete="off"><div class="nr-grid">' +
      '<label class="field full"><span>Rule name</span><input type="text" name="name" placeholder="For example the ticket number" spellcheck="false"></label>' +
      '<label class="field full"><span>Paths</span><textarea name="paths" rows="3" class="mono" placeholder="One per line. Full ' + esc(ms.host) + ' addresses work too." spellcheck="false"></textarea></label>' +
      '<label class="field full"><span>Redirect address</span><input type="text" name="redirectURL" class="mono" placeholder="https://' + esc(ms.host) + '/\u2026" spellcheck="false"></label>' +
      '<div class="field full"><span>Status code</span><div>' + seg('statusCode', C.STATUS_CODES.map((c) => [c, String(c), C.STATUS_LABELS[c]])) + '</div></div>' +
      '<div class="field"><span>Case-sensitive paths</span><div>' + seg('caseSensitive', [['1', 'Yes'], ['0', 'No']]) + '</div></div>' +
      '<div class="field"><span>Keep the query string</span><div>' + seg('useQueryString', [['1', 'Yes'], ['0', 'No']]) + '</div></div>' +
      '<label class="field full"><span>Hosts</span><input type="text" name="host" class="mono" value="' + esc(ms.host) + '" spellcheck="false"></label>' +
      '</div><p class="form-msg" id="nr-msg" role="alert"></p></form>' +
      '<div class="dlg-actions"><span class="hint push" id="nr-hint">Fill in every field to create the rule.</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="nr-create" disabled>Create rule</button></div>',
      (d) => {
        const form = $('#nr-form', d);
        const picked = {};
        const check = () => {
          const ok = form.name.value.trim() && form.paths.value.trim() && form.redirectURL.value.trim() && ['statusCode', 'caseSensitive', 'useQueryString'].every((k) => k in picked);
          $('#nr-create', d).disabled = !ok;
          $('#nr-hint', d).hidden = !!ok;
        };
        d.addEventListener('click', (e) => {
          const b = e.target.closest('.seg button');
          if (!b) return;
          const g = b.parentElement;
          g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
          picked[g.dataset.name] = b.dataset.value;
          check();
        });
        form.addEventListener('input', check);
        form.name.focus();
        $('#nr-create', d).addEventListener('click', () => {
          const lines = form.paths.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
          const paths = [], bad = [];
          for (const line of lines) { const p = C.toPath(line); if (/[\s"]/.test(p)) bad.push(line); else if (!paths.includes(p)) paths.push(p); }
          if (bad.length) { $('#nr-msg', d).textContent = 'Paths can\u2019t contain spaces or quote marks: ' + bad.join(', '); return; }
          const rule = C.normalizeRule({
            id: C.newId(), name: form.name.value.trim(), host: form.host.value.trim(), paths,
            redirectURL: form.redirectURL.value.trim(), statusCode: Number(picked.statusCode),
            caseSensitive: picked.caseSensitive === '1', useQueryString: picked.useQueryString === '1',
          });
          ms.current.rules.push(rule);
          d.close();
          state.ruleId = rule.id; state.q = ''; state.onlyProblems = false;
          recompute(ms);
          renderMain();
          selectRule(rule.id);
          toast('Rule created.');
        });
      }, { keepOnOutsideClick: true });
  }

  function moveDialog() {
    const ms = activeMs(), r = activeRule();
    const idxs = [...state.selected].sort((a, b) => a - b);
    const paths = idxs.map((i) => r.paths[i]);
    const others = C.exportOrder(ms.current.rules).filter((x) => x !== r);
    const listHTML = (q) => {
      q = q.trim().toLowerCase();
      const hits = others.filter((x) => !q || x.name.toLowerCase().includes(q) || x.redirectURL.toLowerCase().includes(q)).slice(0, 200);
      return hits.length ? hits.map((x) => '<button data-id="' + esc(x.id) + '">' + esc(x.name || 'Unnamed rule') + '<small>' + esc(x.redirectURL) + '</small></button>').join('') : '<p class="hint">No rule matches.</p>';
    };
    openDialog('<h2>Move ' + C.plural(paths.length, 'path') + '</h2><p>Choose the rule they should belong to.</p>' +
      '<label class="search">' + ICON.search + '<span class="visually-hidden">Find a rule</span><input type="search" id="mv-q" placeholder="Find a rule by name or address" spellcheck="false"></label>' +
      '<div class="mv-list" id="mv-list">' + listHTML('') + '</div>' +
      '<div class="dlg-actions"><button class="btn" data-close>Cancel</button></div>',
    (d) => {
      const q = $('#mv-q', d);
      q.focus();
      q.addEventListener('input', () => { $('#mv-list', d).innerHTML = listHTML(q.value); });
      $('#mv-list', d).addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]');
        if (!b) return;
        const target = ms.current.rules.find((x) => x.id === b.dataset.id);
        r.paths = r.paths.filter((_, i) => !state.selected.has(i));
        let added = 0;
        for (const p of paths) if (!target.paths.includes(p)) { target.paths.push(p); added++; }
        d.close();
        changed();
        toast('Moved ' + C.plural(paths.length, 'path') + ' to \u201c' + (target.name || 'Unnamed rule') + '\u201d.' + (added < paths.length ? ' ' + (paths.length - added) + ' were already there.' : ''));
      });
    });
  }

  function summaryText(ms, desc) {
    const info = state.doc.info;
    const base = info.policy ? info.policy + (info.version ? ', based on version ' + info.version : '') : state.doc.fileName;
    return 'Redirect changes for ' + ms.host + ' (' + base + '):\n' + desc.lines.map((l) => '- ' + l).join('\n');
  }

  function exportName() {
    const info = state.doc.info;
    if (info.policy && info.version) return info.policy + '_v' + info.version + '_edited.csv';
    return state.doc.fileName.replace(/\.(csv|zip)$/i, '') + '_edited.csv';
  }

  function reviewDialog() {
    const ms = activeMs();
    const diff = C.diffMarket(ms.original, ms.current);
    const desc = C.describeDiff(diff);
    const blockers = newErrors(ms);
    const warns = ms.issues.filter((i) => i.isNew && i.severity === 'warning');
    const summary = summaryText(ms, desc);
    openDialog('<h2>Review and export</h2><p>' + esc(desc.headline.charAt(0).toUpperCase() + desc.headline.slice(1)) + '.</p>' +
      '<div class="dlg-body"><ul class="change-list">' + desc.lines.map((l) => '<li>' + esc(l) + '</li>').join('') + '</ul>' +
      (blockers.length ? '<div class="blocker"><b>Fix ' + C.plural(blockers.length, 'problem') + ' before exporting.</b><ul>' +
        blockers.slice(0, 6).map((i) => '<li><button class="link" data-goto="' + esc(i.ruleId) + '">' + esc(ruleName(i.ruleId)) + '</button>: ' + esc(i.message) + '</li>').join('') +
        (blockers.length > 6 ? '<li>and ' + (blockers.length - 6) + ' more</li>' : '') + '</ul></div>' : '') +
      (!blockers.length && warns.length ? '<div class="warnnote">' + C.plural(warns.length, 'new warning') + '. You can still export, but it\u2019s worth a look.</div>' : '') +
      '<p class="hint">\u201cCopy summary\u201d puts this list on your clipboard, ready to paste into your email to the Akamai team.</p>' +
      '</div>' +
      '<div class="dlg-actions"><button class="btn danger push" id="rv-discard">Discard changes</button>' +
      '<button class="btn" id="rv-copy">Copy summary</button>' +
      '<button class="btn primary" id="rv-save"' + (blockers.length ? ' disabled' : '') + '>Download CSV</button></div>',
    (d) => {
      d.addEventListener('click', (e) => {
        const g = e.target.closest('[data-goto]');
        if (g) { d.close(); selectRule(g.dataset.goto); }
      });
      const discard = $('#rv-discard', d);
      discard.addEventListener('click', () => {
        if (!discard.dataset.armed) { discard.dataset.armed = '1'; discard.textContent = 'Click again to discard'; return; }
        ms.current = clone(ms.original);
        if (!ms.current.rules.some((r) => r.id === state.ruleId)) state.ruleId = null;
        d.close(); recompute(ms); renderAll();
        toast('Changes discarded. You\u2019re back to the file as you opened it.');
      });
      $('#rv-copy', d).addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(summary); }
        catch (e) {
          const ta = document.createElement('textarea');
          ta.value = summary; d.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        $('#rv-copy', d).textContent = 'Copied';
      });
      $('#rv-save', d).addEventListener('click', () => {
        download(exportName(), C.exportCSV(ms.current), 'text/csv');
        ms.exportedSnap = C.snapshot(ms.current);
        $('#rv-save', d).textContent = 'Downloaded';
        toast('Downloaded ' + exportName() + '. Send it to the Akamai team with the summary.');
      });
    });
  }

  function confirmDialog(title, body, action, onYes, opts) {
    const cls = opts && opts.destructive ? 'btn destructive' : 'btn primary';
    openDialog('<h2>' + esc(title) + '</h2><p>' + esc(body) + '</p><div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="' + cls + '" id="cf-yes">' + esc(action) + '</button></div>',
      (d) => { const y = $('#cf-yes', d); y.focus(); y.addEventListener('click', () => { d.close(); onYes(); }); });
  }

  /* ================= actions ================= */

  function applyFix(issue) {
    const ms = activeMs();
    const r = ms.current.rules.find((x) => x.id === issue.ruleId);
    if (!r) return;
    if (issue.fix === 'removePath') r.paths = r.paths.filter((p) => p !== issue.path);
    if (issue.fix === 'removeEmpty') r.paths = r.paths.filter((p) => p !== '');
    if (issue.fix === 'addScheme') r.redirectURL = 'https://' + r.redirectURL.trim();
    if (issue.fix === 'flatten') r.redirectURL = issue.nextTarget;
    if (issue.fix === 'removeDuplicate') {
      const key = (p) => (r.caseSensitive ? p : p.toLowerCase());
      const k = key(issue.path);
      let seen = false;
      r.paths = r.paths.filter((p) => { if (key(p) !== k) return true; if (!seen) { seen = true; return true; } return false; });
    }
    changed();
  }

  function addPaths() {
    const r = activeRule(), ta = $('#add-paths');
    const lines = ta.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    let added = 0;
    const dup = [], bad = [];
    for (const line of lines) {
      const p = C.toPath(line);
      if (/[\s"]/.test(p)) { bad.push(line); continue; }
      if (r.paths.includes(p)) { dup.push(p); continue; }
      r.paths.push(p); added++;
    }
    changed();
    const msg = [];
    if (added) msg.push('Added ' + C.plural(added, 'path') + '.');
    if (dup.length) msg.push(C.plural(dup.length, 'path') + ' already in this rule.');
    if (bad.length) msg.push('Skipped ' + bad.join(', ') + ': paths can\u2019t contain spaces or quote marks.');
    if (msg.length) toast(msg.join(' '), bad.length && !added ? 'error' : null);
    if (bad.length) { $('#add-paths').value = bad.join('\n'); $('#add-paths').focus(); }
  }

  function editPath(btn) {
    const r = activeRule(), idx = Number(btn.dataset.idx), old = r.paths[idx];
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'pl-edit'; input.value = old; input.spellcheck = false;
    input.setAttribute('aria-label', 'Edit path');
    btn.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const finish = (save) => {
      if (done) return; done = true;
      const p = C.toPath(input.value);
      if (save && p && p !== old) {
        if (/[\s"]/.test(p)) { toast('Paths can\u2019t contain spaces or quote marks.', 'error'); changed(); return; }
        r.paths[idx] = p;
      }
      changed();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.closest('dialog')) return;
    const a = el.dataset.action;
    const ms = activeMs(), r = activeRule();
    switch (a) {
      case 'open-file': $('#file-input').click(); break;
      case 'scope': state.scope = el.dataset.scope; renderMain(); $('#rule-search').focus(); break;
      case 'only-problems': state.onlyProblems = el.dataset.on || false; renderMain(); break;
      case 'show-problems': state.onlyProblems = el.dataset.which; state.q = ''; renderMain(); break;
      case 'select-rule': selectRule(el.dataset.id); break;
      case 'new-rule': newRuleDialog(); break;
      case 'review': reviewDialog(); break;
      case 'set-status': r.statusCode = Number(el.dataset.code); changed(true); break;
      case 'fix': { const i = ms.issues.find((x) => x.key === el.dataset.key); if (i) applyFix(i); break; }
      case 'add-paths': addPaths(); break;
      case 'edit-path': editPath(el); break;
      case 'remove-path': r.paths.splice(Number(el.dataset.idx), 1); changed(); break;
      case 'toggle-path': {
        const i = Number(el.dataset.idx);
        if (el.checked) state.selected.add(i); else state.selected.delete(i);
        const top = $('#detail').scrollTop;
        $('#d-paths').innerHTML = pathsHTML(r);
        $('#detail').scrollTop = top;
        break;
      }
      case 'clear-selection': state.selected.clear(); $('#d-paths').innerHTML = pathsHTML(r); break;
      case 'remove-selected': {
        const n = state.selected.size;
        r.paths = r.paths.filter((_, i) => !state.selected.has(i));
        changed();
        toast('Removed ' + C.plural(n, 'path') + '.');
        break;
      }
      case 'move-paths': moveDialog(); break;
      case 'revert-rule': {
        const orig = ms.original.rules.find((x) => x.id === r.id);
        const i = ms.current.rules.indexOf(r);
        ms.current.rules[i] = clone(orig);
        changed();
        break;
      }
      case 'delete-rule':
        confirmDialog('Delete \u201c' + (r.name || 'Unnamed rule') + '\u201d?', 'Its ' + C.plural(r.paths.length, 'path') + ' will stop redirecting once the Akamai team imports your file.', 'Delete rule', () => {
          ms.current.rules = ms.current.rules.filter((x) => x !== r);
          state.ruleId = null;
          changed();
          toast('Rule deleted.');
        }, { destructive: true });
        break;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest('dialog')) return;
    if (t.id === 'rule-search') {
      state.q = t.value;
      clearTimeout(t._timer);
      t._timer = setTimeout(renderList, 120);
      return;
    }
    if (t.id === 'path-filter') {
      state.pathFilter = t.value;
      const ul = $('#d-paths');
      const pos = t.selectionStart;
      ul.innerHTML = pathsHTML(activeRule());
      const f = $('#path-filter'); f.focus(); f.setSelectionRange(pos, pos);
      return;
    }
    if (t.id === 'add-paths') {
      const b = document.querySelector('[data-action="add-paths"]');
      if (b) b.disabled = !t.value.trim();
      t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 220) + 'px';
      return;
    }
    if (t.dataset.field) {
      const r = activeRule();
      if (!r) return;
      r[t.dataset.field] = t.value;
      scheduleRefresh();
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.closest('dialog')) return;
    if (t.id === 'file-input') { if (t.files.length) openFile(t.files[0]); t.value = ''; return; }
    if (t.dataset.toggle) {
      const r = activeRule();
      r[t.dataset.toggle] = t.checked;
      changed(true);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'add-paths' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (e.target.value.trim()) addPaths(); return; }
    if (document.querySelector('dialog[open]')) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === '/' && !typing && $('#rule-search')) { e.preventDefault(); $('#rule-search').focus(); return; }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.classList && e.target.classList.contains('rr')) {
      e.preventDefault();
      const sib = e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling;
      if (sib && sib.dataset.id) selectRule(sib.dataset.id, true);
    }
  });

  // Any open policy is protected from an accidental reload or close, changed or not.
  window.addEventListener('beforeunload', (e) => {
    if (state.doc) { e.preventDefault(); e.returnValue = ''; }
  });

  // drag and drop anywhere on the page
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f && !/\.(zip|csv|txt|xlsx?)$/i.test(f.name)) { toast('Drop the .zip or .csv file from the Akamai team.', 'error'); return; }
    openFile(f);
  });

  /* ================= appearance ================= */
  const THEME_KEY = 'veerca-theme';
  const THEME_ORDER = ['auto', 'light', 'dark'];
  const THEME_NAMES = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  const mqLight = matchMedia('(prefers-color-scheme: light)');
  let themePref = 'auto';
  try { const v = localStorage.getItem(THEME_KEY); if (THEME_ORDER.includes(v)) themePref = v; } catch (e) { /* storage unavailable */ }

  function syncThemeButtons() {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
    document.querySelectorAll('.theme-btn').forEach((b) => {
      b.dataset.pref = themePref;
      b.title = 'Appearance: ' + THEME_NAMES[themePref];
      b.setAttribute('aria-label', 'Appearance: ' + THEME_NAMES[themePref] + '. Switch to ' + THEME_NAMES[next]);
    });
  }
  function applyTheme() {
    document.documentElement.dataset.theme = themePref === 'auto' ? (mqLight.matches ? 'light' : 'dark') : themePref;
    syncThemeButtons();
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.theme-btn')) return;
    themePref = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
    try { localStorage.setItem(THEME_KEY, themePref); } catch (err) { /* storage unavailable */ }
    applyTheme();
    toast('Appearance: ' + THEME_NAMES[themePref] + (themePref === 'auto' ? ', following your system' : ''));
  });
  mqLight.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });
  $('#toast-close').addEventListener('click', hideToast);

  /* ================= start ================= */
  $('#brand-mark').innerHTML = ICON.mark;
  $('#brand-word').outerHTML = wordmark('brand-word');
  applyTheme();
  renderAll();
})();

</script>
</body>
</html>
