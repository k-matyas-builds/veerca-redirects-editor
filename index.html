      (kept.length ? '<p class="hint kept">Also matches on ' + kept.map(([k, l]) => l + ' \u201c' + esc(r[k]) + '\u201d').join(', ') + '. Kept exactly as in the file.</p>' : '');
  }


  function pathsHTML(r) {
    const ms = activeMs();
    const flagged = new Map();
    for (const i of ms.byRule.get(r.id) || []) if (i.path && i.type !== 'chars') flagged.set(i.path, i.isNew ? i.severity : 'known');
    const f = state.pathFilter.trim().toLowerCase();
    const items = r.paths.map((p, idx) => ({ p, idx })).filter(({ p }) => !f || p.toLowerCase().includes(f));
    const sel = state.selected.size;
    return '<div class="paths-head"><h2>Paths <span class="count">' + fmt(r.paths.length) + '</span></h2>' +
      (r.paths.length > 12 ? '<label class="search">' + ICON.search + '<span class="visually-hidden">Filter paths</span><input type="search" id="path-filter" placeholder="Filter paths" value="' + esc(state.pathFilter) + '" spellcheck="false"></label>' : '') +
      '</div>' +
      '<div class="add-paths"><label class="visually-hidden" for="add-paths">Add paths</label><textarea id="add-paths" rows="1" placeholder="Add paths, one per line. Full ' + esc(ms.host) + ' addresses work too." spellcheck="false"></textarea>' +
      '<button class="btn" data-action="add-paths" disabled>Add</button></div>' +
      (sel ? '<div class="selbar"><span>' + C.plural(sel, 'path') + ' selected</span><button class="btn subtle" data-action="move-paths">Move to another rule</button><button class="btn danger" data-action="remove-selected">Remove</button><button class="btn subtle" data-action="clear-selection">Clear</button></div>' : '') +
      (items.length ? '<ul class="path-list">' + items.map(({ p, idx }) => {
        const fl = flagged.get(p);
        return '<li class="pl"><input type="checkbox" data-action="toggle-path" data-idx="' + idx + '" aria-label="Select ' + esc(p || 'empty entry') + '"' + (state.selected.has(idx) ? ' checked' : '') + '>' +
          '<span class="pl-text" data-idx="' + idx + '">' + (p === '' ? '<em>Empty entry</em>' : esc(p)) + '</span>' +
          (fl ? '<span class="sev ' + fl + '"></span>' : '') +
          '<span class="pl-actions"><button class="pl-btn" data-action="edit-path-btn" data-idx="' + idx + '" aria-label="Edit ' + esc(p || 'empty entry') + '">' + ICON.pencil + 'Edit</button>' +
          '<button class="pl-btn del" data-action="remove-path" data-idx="' + idx + '" aria-label="Delete ' + esc(p || 'empty entry') + '">' + ICON.trash + 'Delete</button></span></li>';
      }).join('') + '</ul>' : (r.paths.length ? '<p class="hint">No paths match the filter.</p>' : '<p class="hint">This rule has no paths yet. Add one above.</p>'));
  }

  function footHTML(r) {
    const st = ruleState(activeMs(), r);
    return (st === 'new' ? '<span class="note">Added by you</span>'
      : st === 'changed' ? '<button class="btn subtle" data-action="revert-rule">Undo all changes to this rule</button>' : '') +
      '<button class="btn danger" data-action="delete-rule">' + ICON.trash + 'Delete rule</button>';
  }


  /* light refresh used while typing, so inputs keep focus */
  let refreshTimer = null;
  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      const ms = activeMs(), r = activeRule();
      if (!ms || !ms.current) return;
      recompute(ms);
      renderHead(); renderList();
      if (r) {
        const ordered = C.exportOrder(ms.current.rules);
        const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        set('d-route', routeHTML(r)); set('d-problems', problemsHTML(r)); set('d-foot', footHTML(r));
        set('d-sub', subLine(r, ordered.indexOf(r) + 1, ordered.length));
      }
    }, 180);
  }

  /* full refresh after structural edits */
  function changed(keepPaths) {
    const ms = activeMs();
    recompute(ms);
    if (!keepPaths) state.selected.clear();
    const detail = $('#detail'), top = detail ? detail.scrollTop : 0;
    renderHead(); renderList(); renderDetail();
    if (detail) $('#detail').scrollTop = top;
  }

  function selectRule(id, focusList) {
    const ms = activeMs();
    if (!ms.current.rules.some((r) => r.id === id)) return;
    if (state.editing && state.editing.ruleId !== id) {
      if (draftChanged()) {
        confirmDialog('Discard your edits?', 'You changed this rule but didn\u2019t save it. Leaving it now throws those edits away.', 'Discard edits',
          () => { state.editing = null; selectRule(id, focusList); }, { destructive: true });
        return;
      }
      state.editing = null;
    }
    state.ruleId = id; state.selected.clear(); state.pathFilter = '';
    const { rows } = visibleRules();
    if (!rows.some((x) => x.r.id === id)) { state.q = ''; state.onlyProblems = false; renderMain(); }
    else {
      document.querySelectorAll('.rr.sel').forEach((x) => { x.classList.remove('sel'); x.removeAttribute('aria-current'); });
      const cur = document.querySelector('.rr[data-id="' + CSS.escape(id) + '"]');
      if (cur) { cur.classList.add('sel'); cur.setAttribute('aria-current', 'true'); }
      renderDetail();
    }
    $('#detail').scrollTop = 0;
    const row = document.querySelector('.rr[data-id="' + CSS.escape(id) + '"]');
    if (row) { row.scrollIntoView({ block: 'nearest' }); if (focusList) row.focus(); }
  }

  /* ================= toasts, files, dialogs ================= */

  let toastTimer = 0;
  function toast(message, kind, html) {
    const el = $('#toast');
    $('#toast-text').innerHTML = esc(message) + (html ? ' ' + html : '');
    el.dataset.kind = kind === 'error' ? 'error' : 'info';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, kind === 'error' ? 8000 : 4000);
  }
  function hideToast() { $('#toast').classList.remove('show'); }


  function download(name, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function openDialog(html, onMount, opts) {
    const d = document.createElement('dialog');
    d.innerHTML = '<div class="dlg">' + html + '</div>';
    document.body.appendChild(d);
    d.addEventListener('close', () => d.remove());
    d.addEventListener('click', (e) => {
      if (e.target === d && !(opts && opts.keepOnOutsideClick)) d.close();
      if (e.target.closest('[data-close]')) d.close();
    });
    d.showModal();
    if (onMount) onMount(d);
    return d;
  }

  function newRuleDialog() {
    const ms = activeMs();
    const yn = (name) => '<div class="seg" role="radiogroup" data-name="' + name + '">' +
      '<button type="button" role="radio" aria-checked="false" data-value="1">Yes</button>' +
      '<button type="button" role="radio" aria-checked="false" data-value="0">No</button></div>';
    openDialog(
      '<h2>New rule</h2><p>You add its paths next, in the rule\u2019s details.</p>' +
      '<form id="nr-form" class="dlg-body" autocomplete="off"><div class="nr-grid">' +
      '<label class="field full"><span>Rule name</span><input type="text" name="name" placeholder="For example the ticket number" spellcheck="false"></label>' +
      '<label class="field full"><span>Redirect URL</span><input type="text" name="redirectURL" class="mono" placeholder="https://' + esc(ms.host) + '/\u2026" spellcheck="false"></label>' +
      '<label class="field"><span>Regex</span><input type="text" name="regex" class="mono" placeholder="Optional" spellcheck="false"></label>' +
      '<div class="field"><span>Status code</span><div>' + statusPicker(0, 'statusCode') + '</div></div>' +
      '<div class="field"><span>Use query string</span><div>' + yn('useQueryString') + '</div></div>' +
      '<div class="field"><span>Case sensitive</span><div>' + yn('caseSensitive') + '</div></div>' +
      '</div><p class="form-msg" id="nr-msg" role="alert"></p></form>' +
      '<div class="dlg-actions"><span class="hint push" id="nr-hint">Everything except Regex is required.</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="nr-create" disabled>Add rule</button></div>',
      (d) => {
        const form = $('#nr-form', d);
        const picked = {};
        const check = () => {
          const ok = form.name.value.trim() && form.redirectURL.value.trim() && ['statusCode', 'caseSensitive', 'useQueryString'].every((k) => k in picked);
          $('#nr-create', d).disabled = !ok;
          $('#nr-hint', d).hidden = !!ok;
        };
        d.addEventListener('click', (e) => {
          const b = e.target.closest('.seg button');
          if (!b) return;
          const group = b.closest('[data-name]');
          b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
          if (group.classList.contains('sp')) {
            picked.statusCode = b.dataset.code;
            const cur = group.querySelector('.sp-current');
            cur.innerHTML = spLabel(Number(b.dataset.code));
            cur.classList.remove('empty');
            cur.title = STATUS_DESC[b.dataset.code];
            closePickers();
            cur.focus();
          } else picked[group.dataset.name] = b.dataset.value;
          check();
        });
        form.addEventListener('input', check);
        form.name.focus();
        $('#nr-create', d).addEventListener('click', () => {
          const twin = C.findTwin(ms.current, C.normalizeRule({
            host: ms.host, redirectURL: form.redirectURL.value.trim(), regex: form.regex.value.trim(), statusCode: Number(picked.statusCode),
            caseSensitive: picked.caseSensitive === '1', useQueryString: picked.useQueryString === '1',
          }));
          if (twin) {
            openDialog('<h2>This rule already exists</h2>' +
              '<p>\u201c' + esc(twin.rule.name || 'Unnamed rule') + '\u201d (rule ' + twin.pos + ') already sends visitors to <span class="mono">' + esc(twin.rule.redirectURL) +
              '</span> with the same settings. Add your paths to it instead of creating a second rule.</p>' +
              '<div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="dt-open">Open existing rule instead</button></div>',
            (d2) => {
              $('#dt-open', d2).focus();
              $('#dt-open', d2).addEventListener('click', () => {
                d2.close(); d.close(); state.q = ''; state.onlyProblems = false; selectRule(twin.rule.id);
                const ta = $('#add-paths'); if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); }
              });
            });
            return;
          }
          const wanted = form.name.value.trim().toLowerCase();
          const same = C.exportOrder(ms.current.rules).find((x) => x.name.trim().toLowerCase() === wanted);
          if (same && !d.dataset.forced) {
            const pos = C.exportOrder(ms.current.rules).indexOf(same) + 1;
            openDialog('<h2>A rule with this name already exists</h2>' +
              '<p>\u201c' + esc(same.name) + '\u201d is rule ' + pos + ' and sends visitors to <span class="mono">' + esc(same.redirectURL) + '</span>. ' +
              'To add paths to it, open it instead of creating a second rule with the same name.</p>' +
              '<div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="dn-open">Open existing rule instead</button></div>' +
              '<p class="override"><button class="link" id="dn-force">I know what I\u2019m doing, create anyway</button></p>',
            (d2) => {
              $('#dn-open', d2).focus();
              $('#dn-open', d2).addEventListener('click', () => { d2.close(); d.close(); state.q = ''; state.onlyProblems = false; selectRule(same.id); });
              $('#dn-force', d2).addEventListener('click', () => { d2.close(); d.dataset.forced = '1'; $('#nr-create', d).click(); });
            });
            return;
          }
          const rule = C.normalizeRule({
            id: C.newId(), name: form.name.value.trim(), host: ms.host, paths: [],
            redirectURL: form.redirectURL.value.trim(), regex: form.regex.value.trim(), statusCode: Number(picked.statusCode),
            caseSensitive: picked.caseSensitive === '1', useQueryString: picked.useQueryString === '1',
          });
          ms.current.rules.push(rule);
          d.close();
          state.ruleId = rule.id; state.q = ''; state.onlyProblems = false;
          recompute(ms);
          renderMain();
          selectRule(rule.id);
          const ta = $('#add-paths');
          if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); }
          toast('Rule created. Add its paths below.');
        });
      }, { keepOnOutsideClick: true });
  }


  function moveDialog() {

      '<div class="mv-list" id="mv-list">' + listHTML('') + '</div>' +

      q.focus();
      q.addEventListener('input', () => { $('#mv-list', d).innerHTML = listHTML(q.value); });
      $('#mv-list', d).addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]');
        if (!b) return;
        const target = ms.current.rules.find((x) => x.id === b.dataset.id);
        r.paths = r.paths.filter((_, i) => !state.selected.has(i));
        let added = 0;
        for (const p of paths) if (!target.paths.includes(p)) { target.paths.push(p); added++; }
        d.close();
        changed();
        toast('Moved ' + C.plural(paths.length, 'path') + ' to \u201c' + (target.name || 'Unnamed rule') + '\u201d.' + (added < paths.length ? ' ' + (paths.length - added) + ' were already there.' : ''));
      });
    });
  }

  function summaryText(ms, desc) {
    const info = state.doc.info;
    const base = info.policy ? info.policy + (info.version ? ', based on version ' + info.version : '') : state.doc.fileName;
    return 'Redirect changes for ' + ms.host + ' (' + base + '):\n' + desc.lines.map((l) => '- ' + l).join('\n');
  }

  function exportName() {
    const info = state.doc.info;
    if (info.policy && info.version) return info.policy + '_v' + info.version + '_edited.csv';
    return state.doc.fileName.replace(/\.(csv|zip)$/i, '') + '_edited.csv';
  }

  function reviewDialog() {
    const ms = activeMs();
    const diff = C.diffMarket(ms.original, ms.current);
    const desc = C.describeDiff(diff);
    const blockers = newErrors(ms);
    const warns = ms.issues.filter((i) => i.isNew && i.severity === 'warning');
    const summary = summaryText(ms, desc);
    openDialog('<h2>Review and export</h2><p>' + esc(desc.headline.charAt(0).toUpperCase() + desc.headline.slice(1)) + '.</p>' +
      '<div class="dlg-body"><ul class="change-list">' + desc.lines.map((l) => '<li>' + esc(l) + '</li>').join('') + '</ul>' +
      (blockers.length ? '<div class="blocker"><b>Fix ' + C.plural(blockers.length, 'problem') + ' from your changes before exporting.</b><ul>' +
        blockers.slice(0, 6).map((i) => '<li><button class="link" data-goto="' + esc(i.ruleId) + '">' + esc(ruleName(i.ruleId)) + '</button>: ' + esc(i.message) + '</li>').join('') +
        (blockers.length > 6 ? '<li>and ' + (blockers.length - 6) + ' more</li>' : '') + '</ul></div>' : '') +
      (!blockers.length && warns.length ? '<div class="warnnote">' + C.plural(warns.length, 'warning') + ' from your changes. You can still export, but it\u2019s worth a look.</div>' : '') +
      '<p class="hint">\u201cCopy summary\u201d puts this list on your clipboard, ready to paste into your email to the Akamai team.</p>' +
      '</div>' +
      '<div class="dlg-actions"><button class="btn danger push" id="rv-discard">Discard changes</button>' +
      '<button class="btn" id="rv-copy">Copy summary</button>' +
      '<button class="btn primary" id="rv-save"' + (blockers.length ? ' disabled' : '') + '>Download CSV</button></div>',
    (d) => {
      d.addEventListener('click', (e) => {
        const g = e.target.closest('[data-goto]');
        if (g) { d.close(); selectRule(g.dataset.goto); }
      });
      const discard = $('#rv-discard', d);
      discard.addEventListener('click', () => {
        if (!discard.dataset.armed) { discard.dataset.armed = '1'; discard.textContent = 'Click again to discard'; return; }
        ms.current = clone(ms.original);
        if (!ms.current.rules.some((r) => r.id === state.ruleId)) state.ruleId = null;
        d.close(); recompute(ms); renderAll();
        toast('Changes discarded. You\u2019re back to the file as you opened it.');
      });
      $('#rv-copy', d).addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(summary); }
        catch (e) {
          const ta = document.createElement('textarea');
          ta.value = summary; d.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        $('#rv-copy', d).textContent = 'Copied';
      });
      $('#rv-save', d).addEventListener('click', () => {
        download(exportName(), C.exportCSV(ms.current), 'text/csv');
        ms.exportedSnap = C.snapshot(ms.current);
        $('#rv-save', d).textContent = 'Downloaded';
        toast('Downloaded ' + exportName() + '. Send it to the Akamai team with the summary.');
      });
    });
  }

  function confirmDialog(title, body, action, onYes, opts) {
    const cls = opts && opts.destructive ? 'btn destructive' : 'btn primary';
    openDialog('<h2>' + esc(title) + '</h2><p>' + esc(body) + '</p><div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="' + cls + '" id="cf-yes">' + esc(action) + '</button></div>',
      (d) => { const y = $('#cf-yes', d); y.focus(); y.addEventListener('click', () => { d.close(); onYes(); }); });
  }

  /* ================= actions ================= */

  function applyFix(issue) {
    const ms = activeMs();
    const r = ms.current.rules.find((x) => x.id === issue.ruleId);
    if (!r) return;
    if (issue.fix === 'merge') {
      const target = ms.current.rules.find((x) => x.id === issue.otherId);
      if (!target) return;
      let moved = 0;
      for (const p of r.paths) if (!target.paths.includes(p)) { target.paths.push(p); moved++; }
      ms.current.rules = ms.current.rules.filter((x) => x !== r);
      state.ruleId = target.id;
      changed();
      selectRule(target.id);
      toast('Moved ' + C.plural(moved, 'path') + ' into \u201c' + (target.name || 'Unnamed rule') + '\u201d and deleted \u201c' + (r.name || 'Unnamed rule') + '\u201d.');
      return;
    }
    if (issue.fix === 'removePath') r.paths = r.paths.filter((p) => p !== issue.path);
    if (issue.fix === 'removeEmpty') r.paths = r.paths.filter((p) => p !== '');
    if (issue.fix === 'addScheme') r.redirectURL = 'https://' + r.redirectURL.trim();
    if (issue.fix === 'flatten') r.redirectURL = issue.nextTarget;
    if (issue.fix === 'removeDuplicate') {
      const key = (p) => (r.caseSensitive ? p : p.toLowerCase());
      const k = key(issue.path);
      let seen = false;
      r.paths = r.paths.filter((p) => { if (key(p) !== k) return true; if (!seen) { seen = true; return true; } return false; });
    }
    changed();
  }

  function addPaths() {
    const r = activeRule(), ta = $('#add-paths');
    const lines = ta.value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    const dup = [], bad = [], fresh = [];
    for (const line of lines) {
      const p = C.toPath(line);
      if (/[\s"]/.test(p)) { bad.push(line); continue; }
      if (r.paths.includes(p) || fresh.includes(p)) { dup.push(p); continue; }
      fresh.push(p);
    }
    const shared = fresh.filter((p) => C.pathOwners(activeMs().current, p, r).length);
    commitPaths(r, fresh, dup, bad, [], shared);
  }

  function commitPaths(r, take, dup, keepInBox, skippedTaken, shared) {
    const bad = keepInBox.filter((x) => !skippedTaken.includes(x));
    r.paths.push(...take);
    const added = take.length;
    changed();
    const msg = [];
    if (added) msg.push('Added ' + C.plural(added, 'path') + '.');
    if (dup.length) msg.push(C.plural(dup.length, 'path') + ' already in this rule.');
    if (bad.length) msg.push('Skipped ' + bad.join(', ') + ': paths can\u2019t contain spaces or quote marks.');
    if (shared && shared.length) msg.push(shared.length === 1 ? 'Another rule has it too, so it shows under Errors until one copy is gone.'
      : shared.length + ' of them are in another rule too, so they show under Errors until one copy is gone.');
    if (skippedTaken.length) msg.push(C.plural(skippedTaken.length, 'path') + ' left out because another rule already has ' + (skippedTaken.length === 1 ? 'it' : 'them') + '.');
    if (msg.length) toast(msg.join(' '), bad.length && !added ? 'error' : null);
    if (keepInBox.length) {
      const box = $('#add-paths');
      box.value = keepInBox.join('\n');
      box.dispatchEvent(new Event('input', { bubbles: true }));
      box.focus();
    }
  }

  function editPath(btn) {
    const r = activeRule(), idx = Number(btn.dataset.idx), old = r.paths[idx];
    const li = btn.closest('.pl');
    document.querySelectorAll('.pl.editing').forEach((x) => { if (x !== li) x.dispatchEvent(new Event('pl-cancel')); });
    li.classList.add('editing');
    li.innerHTML = '<input type="text" class="pl-edit" spellcheck="false" aria-label="Edit path">' +
      '<button class="icon-btn small pl-ok" type="button" title="Save path" aria-label="Save path">' + ICON.ok + '</button>' +
      '<button class="icon-btn small" type="button" title="Cancel" aria-label="Cancel">' + ICON.x + '</button>';
    const input = li.querySelector('input');
    input.value = old;
    input.focus(); input.select();
    const save = () => {
      const p = C.toPath(input.value);
      if (p && /[\s"]/.test(p)) { toast('Paths can\u2019t contain spaces or quote marks.', 'error'); input.focus(); return; }
      if (p && p !== old) r.paths[idx] = p;
      changed(true);
    };
    const cancel = () => { const top = $('#detail').scrollTop; $('#d-paths').innerHTML = pathsHTML(r); $('#detail').scrollTop = top; };
    li.querySelector('.pl-ok').addEventListener('click', save);
    li.querySelector('.pl-ok + .icon-btn').addEventListener('click', cancel);
    li.addEventListener('pl-cancel', cancel);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancel(); }
    });
  }


  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.closest('dialog')) return;
    const a = el.dataset.action;
    const ms = activeMs(), r = activeRule();
    switch (a) {
      case 'open-file': $('#file-input').click(); break;
      case 'scope': { state.scope = el.dataset.scope; renderMain(); const s = $('#rule-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } break; }
      case 'only-problems': state.onlyProblems = el.dataset.on || false; renderMain(); break;
      case 'show-problems': state.onlyProblems = el.dataset.which; state.q = ''; renderMain(); break;
      case 'select-rule': selectRule(el.dataset.id); break;
      case 'new-rule': newRuleDialog(); break;
      case 'review': reviewDialog(); break;
      case 'set-status': r.statusCode = Number(el.dataset.code); changed(true); break;
      case 'set-bool': r[el.dataset.bool] = el.dataset.v === '1'; changed(true); break;
      case 'edit-rule': startEdit(el.dataset.focus); break;
      case 'cancel-edit': cancelEdit(); break;
      case 'save-edit': saveEdit(); break;
      case 'draft-status': state.editing.draft.statusCode = Number(el.dataset.code); renderEditFields(); break;
      case 'draft-bool': state.editing.draft[el.dataset.bool] = el.dataset.v === '1'; renderEditFields(); break;
      case 'edit-path-btn': editPath(el); break;
      case 'fix': { const i = ms.issues.find((x) => x.key === el.dataset.key); if (i) applyFix(i); break; }
      case 'add-paths': addPaths(); break;
      case 'remove-path': r.paths.splice(Number(el.dataset.idx), 1); changed(); break;
      case 'toggle-path': {
        const i = Number(el.dataset.idx);
        if (el.checked) state.selected.add(i); else state.selected.delete(i);
        const top = $('#detail').scrollTop;
        $('#d-paths').innerHTML = pathsHTML(r);
        $('#detail').scrollTop = top;
        break;
      }
      case 'clear-selection': state.selected.clear(); $('#d-paths').innerHTML = pathsHTML(r); break;
      case 'remove-selected': {
        const n = state.selected.size;
        r.paths = r.paths.filter((_, i) => !state.selected.has(i));
        changed();
        toast('Removed ' + C.plural(n, 'path') + '.');
        break;
      }
      case 'move-paths': moveDialog(); break;
      case 'revert-rule': {
        const orig = ms.original.rules.find((x) => x.id === r.id);
        const i = ms.current.rules.indexOf(r);
        ms.current.rules[i] = clone(orig);
        changed();
        break;
      }
      case 'delete-rule':
        confirmDialog('Delete \u201c' + (r.name || 'Unnamed rule') + '\u201d?', 'Its ' + C.plural(r.paths.length, 'path') + ' will stop redirecting once the Akamai team imports your file.', 'Delete rule', () => {
          ms.current.rules = ms.current.rules.filter((x) => x !== r);
          state.ruleId = null; state.editing = null;
          changed();
          toast('Rule deleted.');
        }, { destructive: true });
        break;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.closest('dialog')) return;
    if (t.id === 'rule-search') {
      state.q = t.value;
      clearTimeout(t._timer);
      t._timer = setTimeout(renderList, 120);
      return;
    }
    if (t.id === 'path-filter') {
      state.pathFilter = t.value;
      const ul = $('#d-paths');
      const pos = t.selectionStart;
      ul.innerHTML = pathsHTML(activeRule());
      const f = $('#path-filter'); f.focus(); f.setSelectionRange(pos, pos);
      return;
    }
    if (t.id === 'add-paths') {
      const b = document.querySelector('[data-action="add-paths"]');
      if (b) b.disabled = !t.value.trim();
      t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 220) + 'px';
      return;
    }
    if (t.dataset.draft && state.editing) { state.editing.draft[t.dataset.draft] = t.value; return; }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.closest('dialog')) return;
    if (t.id === 'file-input') { if (t.files.length) openFile(t.files[0]); t.value = ''; return; }
    if (t.dataset.toggle) {
      const r = activeRule();
      r[t.dataset.toggle] = t.checked;
      changed(true);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'add-paths' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); if (e.target.value.trim()) addPaths(); return; }
    if (document.querySelector('dialog[open]')) return;
    if (state.editing && e.target.dataset && e.target.dataset.draft) {
      if (e.key === 'Enter') { e.preventDefault(); saveEdit(); return; }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); return; }
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === '/' && !typing && $('#rule-search')) { e.preventDefault(); $('#rule-search').focus(); return; }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.classList && e.target.classList.contains('rr')) {
      e.preventDefault();
      const sib = e.key === 'ArrowDown' ? e.target.nextElementSibling : e.target.previousElementSibling;
      if (sib && sib.dataset.id) selectRule(sib.dataset.id, true);
    }
  });

  // Any open policy is protected from an accidental reload or close, changed or not.
  window.addEventListener('beforeunload', (e) => {
    if (state.doc) { e.preventDefault(); e.returnValue = ''; }
  });

  // drag and drop anywhere on the page
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f && !/\.(zip|csv|txt|xlsx?)$/i.test(f.name)) { toast('Drop the .zip or .csv file from the Akamai team.', 'error'); return; }
    openFile(f);
  });

  document.addEventListener('click', (e) => {
    const cur = e.target.closest('.sp-current');
    if (cur) {
      const sp = cur.closest('.sp');
      closePickers(sp);
      sp.classList.add('open');
      cur.setAttribute('aria-expanded', 'true');
      const on = sp.querySelector('.sp-options [aria-checked="true"]') || sp.querySelector('.sp-options button');
      if (on) on.focus();
      return;
    }
    if (!e.target.closest('.sp')) closePickers();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const open = document.querySelector('.sp.open');
    if (!open) return;
    e.preventDefault(); e.stopPropagation();
    closePickers();
    open.querySelector('.sp-current').focus();
  }, true);

  /* ================= appearance ================= */
  const THEME_KEY = 'veerca-theme';
  const THEME_ORDER = ['auto', 'light', 'dark'];
  const THEME_NAMES = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  const mqLight = matchMedia('(prefers-color-scheme: light)');
  let themePref = 'auto';
  try { const v = localStorage.getItem(THEME_KEY); if (THEME_ORDER.includes(v)) themePref = v; } catch (e) { /* storage unavailable */ }

  function syncThemeButtons() {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
    document.querySelectorAll('.theme-btn').forEach((b) => {
      b.dataset.pref = themePref;
      b.title = 'Appearance: ' + THEME_NAMES[themePref];
      b.setAttribute('aria-label', 'Appearance: ' + THEME_NAMES[themePref] + '. Switch to ' + THEME_NAMES[next]);
    });
  }
  function applyTheme() {
    document.documentElement.dataset.theme = themePref === 'auto' ? (mqLight.matches ? 'light' : 'dark') : themePref;
    syncThemeButtons();
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.theme-btn')) return;
    themePref = THEME_ORDER[(THEME_ORDER.indexOf(themePref) + 1) % THEME_ORDER.length];
    try { localStorage.setItem(THEME_KEY, themePref); } catch (err) { /* storage unavailable */ }
    applyTheme();
    toast('Appearance: ' + THEME_NAMES[themePref] + (themePref === 'auto' ? ', following your system' : ''));
  });
  mqLight.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });
  $('#toast-close').addEventListener('click', hideToast);

  /* ================= start ================= */
  $('#brand-mark').innerHTML = ICON.mark;
  $('#brand-word').outerHTML = wordmark('brand-word');

  // Line the middle of the VEERČA letters up with the middle of "Redirects Editor".
  // The text's middle depends on the system font, so it's measured rather than guessed.
  function alignBrand() {
    const sub = $('.brand-sub'), wm = $('.brand .wordmark');
    if (!sub || !wm) return;
    const cs = getComputedStyle(sub);
    const letterH = parseFloat(getComputedStyle(wm).height) * 28 / 39;              // letters fill 28 of the drawing's 39 units, resting on its bottom edge
    let textMid = parseFloat(cs.fontSize) * 0.36;                                   // fallback: typical cap-height middle
    const ctx = document.createElement('canvas').getContext('2d');
    for (const family of [cs.fontFamily, 'system-ui, sans-serif']) {
      ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + family;
      if (ctx.font.indexOf(cs.fontSize) === -1) continue;                           // this browser couldn't read that font list
      const m = ctx.measureText(sub.textContent.trim());
      if (m.actualBoundingBoxAscent > 0) { textMid = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2; break; }
    }
    wm.style.transform = 'translateY(' + (letterH / 2 - textMid).toFixed(2) + 'px)';
  }
  alignBrand();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignBrand);
  applyTheme();
  renderAll();
})();

</script>
</body>
</html>
