*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--stage);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
*{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}

.ambient{position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:var(--ambient);filter:blur(24px);transition:opacity .7s var(--ease)}
#app:not(.welcome-mode) ~ .ambient{opacity:.55}

/* ---------- Glass ---------- */
.glass,.glass-strong{position:relative;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(28px) saturate(1.8);backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--glass-shadow)}
.glass::before,.glass-strong::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

/* ---------- Buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;background:var(--btn-bg);box-shadow:var(--btn-shadow);
  transition:background .15s,transform .12s,filter .15s}
.btn:hover:not(:disabled){background:var(--btn-bg-hover)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.primary{overflow:hidden;color:#fff;font-weight:600;background:var(--gloss);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.18),0 6px 18px -6px rgba(6,111,239,.7),0 1px 2px rgba(0,0,0,.3)}
.btn.primary::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:48%;border-radius:999px 999px 60% 60%/100% 100% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0));pointer-events:none}
.btn.primary:hover:not(:disabled){background:var(--gloss);filter:brightness(1.08)}
.btn.primary:disabled{opacity:.38;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.btn.destructive{overflow:hidden;color:#fff;font-weight:600;background:linear-gradient(180deg,#FF6E64 0%,#FF3B30 52%,#E2291F 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18),0 6px 18px -6px rgba(255,59,48,.7),0 1px 2px rgba(0,0,0,.3)}
.btn.destructive::after{content:"";position:absolute;left:8%;right:8%;top:1px;height:48%;border-radius:999px 999px 60% 60%/100% 100% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.btn.destructive:hover:not(:disabled){background:linear-gradient(180deg,#FF6E64 0%,#FF3B30 52%,#E2291F 100%);filter:brightness(1.07)}
.btn.lg{height:38px;padding:0 18px;font-size:14px}
.btn.subtle,.btn.danger{background:none;box-shadow:none;color:var(--link)}
.btn.danger{color:var(--note-bad-ink)}
.btn.subtle:hover:not(:disabled){background:var(--hover)}
.btn.danger:hover:not(:disabled){background:var(--note-bad-bg)}
.btn.danger svg{width:12px;height:12px}
.d-foot{padding-right:6px}
.d-foot .btn.danger{height:26px;gap:5px;padding:0 10px 0 8px;font-size:12.5px}
.btn.icon{width:32px;padding:0;flex:none}
.link{padding:0;border:0;background:none;font:inherit;color:var(--link);text-align:left}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:28px;height:28px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--hover-2);color:var(--ink)}
.icon-btn svg{width:13px;height:13px}
.theme-btn svg{display:none}
.theme-btn[data-pref="auto"] .ti-auto,.theme-btn[data-pref="light"] .ti-light,.theme-btn[data-pref="dark"] .ti-dark{display:block}

/* ---------- Fields ---------- */
input[type=text],input[type=search],textarea{display:block;width:100%;height:36px;padding:0 11px;border:0;border-radius:10px;outline:none;
  background:var(--field-bg);box-shadow:var(--field-shadow);font-size:14px;color:var(--ink)}
textarea{height:auto;min-height:38px;padding:9px 11px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{box-shadow:inset 0 0 0 1px rgba(75,151,255,.8),0 0 0 3px rgba(75,151,255,.25)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input.mono,textarea.mono{font-family:var(--mono);font-size:12.5px}
.search{position:relative;display:block}
.search svg{position:absolute;left:12px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{height:34px;padding-left:33px;border-radius:999px}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.field > span:first-child{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3)}
.form-msg{margin:0 0 12px;font-size:13px;color:var(--note-bad-ink)}
.form-msg:empty{display:none}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--seg-bg);box-shadow:var(--seg-ring)}
.seg button{height:26px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:12.5px;font-weight:500;color:var(--ink-2);
  white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{color:var(--ink);background:var(--seg-on);box-shadow:var(--seg-on-shadow)}

.switch-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.switch-row:first-child{border-top:0}
.sw-text{flex:1;display:flex;flex-direction:column;font-size:13.5px}
.sw-text small{color:var(--ink-3);font-size:12px}
.switch-row input{position:absolute;opacity:0;width:1px;height:1px}
.sw{position:relative;flex:none;width:38px;height:22px;border-radius:11px;background:var(--track);transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
.switch-row input:checked + .sw{background:var(--accent)}
.switch-row input:checked + .sw::after{transform:translateX(16px)}
.switch-row input:focus-visible + .sw{outline:2px solid var(--accent-2);outline-offset:2px}

/* ---------- Brand ---------- */
.mark{display:block;flex:none;width:30px;height:30px;filter:drop-shadow(0 3px 6px rgba(6,111,239,.35))}
.mark img{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none}
.wordmark{display:block;color:var(--ink)}
.wordmark .hacek{stroke:var(--accent-2)}
.brand{display:flex;align-items:center;gap:11px}
.brand-text{display:flex;align-items:baseline;gap:11px}
.brand .wordmark{height:16.2px;width:auto}
.brand-sub{padding-left:11px;border-left:1px solid var(--sep);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}

/* ---------- Frame ---------- */
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr);gap:var(--gap);padding:var(--gap)}
#app.welcome-mode{grid-template-rows:minmax(0,1fr)}
#app.welcome-mode .topbar{display:none}
.topbar{display:flex;align-items:center;gap:12px;padding:0 8px 0 11px;border-radius:999px}
.source{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:var(--chip-bg);
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.chip b{font-weight:600;color:var(--ink);margin-right:5px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.center{flex:1;display:grid;place-items:center;padding:24px;overflow:auto}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent-2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Welcome ---------- */
.welcome{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.w-theme{position:absolute;top:4px;right:4px}
.w-mark{width:96px;height:96px;margin-bottom:26px;filter:drop-shadow(0 16px 28px rgba(6,111,239,.42)) drop-shadow(0 2px 4px rgba(0,0,0,.2));
  animation:markIn .7s var(--ease) both}
@keyframes markIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
.w-word{height:59px;width:auto}
.w-sub{margin:16px 0 0;font:500 19px/1.3 var(--font-d);letter-spacing:.01em;color:var(--ink-2)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(440px,100%);margin-top:40px;padding:30px 28px 26px;border-radius:24px;
  background:var(--dz-dash),var(--well);cursor:pointer;transition:background-color .2s,box-shadow .2s,transform .3s var(--ease)}
.dropzone:hover{background:var(--dz-dash),var(--hover)}
.dz-icon{width:30px;height:30px;color:var(--ink-3);transition:color .2s,transform .3s var(--ease)}
.dz-or{margin:0;font-size:13.5px;color:var(--ink-2)}
body.is-welcome.dragging .dropzone{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent-2);transform:scale(1.02)}
body.is-welcome.dragging .dz-icon{color:var(--accent-2);transform:translateY(3px)}
body.is-welcome.dragging::after{display:none}
.welcome .form-msg{margin:16px 0 0;max-width:52ch;padding:9px 14px;border-radius:12px;background:var(--note-bad-bg)}
body.dragging::after{content:"Drop to open the policy";position:fixed;inset:16px;z-index:60;display:grid;place-items:center;border-radius:28px;pointer-events:none;
  background:rgba(6,111,239,.16);box-shadow:inset 0 0 0 2px rgba(75,151,255,.8);font:600 17px var(--font-d);color:var(--ink)}

/* ---------- Market view ---------- */
.market{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
.market-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 28px;padding:6px 8px 0}
.mh-title h1{margin:0;font:600 28px/1.14 var(--font-d);letter-spacing:.004em}
.mh-title a{color:var(--ink-2);text-decoration:none;font-size:13.5px}
.mh-title a:hover{color:var(--link)}
.mh-when{display:block;margin-top:1px;font-size:12px;color:var(--ink-3)}
.mh-stats{display:flex;gap:4px}
.stat{display:flex;flex-direction:column;justify-content:center;padding:4px 12px;border:0;border-radius:12px;background:none;text-align:left;line-height:1.2}
.stat b{font:600 17px var(--font-d);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}

.pb-row{display:flex;gap:8px}
.pb{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 9px;border:0;border-radius:14px;text-align:left;line-height:1.25;transition:background .15s,box-shadow .15s}
.pb-icon{display:grid;place-items:center;flex:none}
.pb-icon svg{width:16px;height:16px}

.pb-text b{font-size:13.5px;font-weight:600}
.pb-text small{font-size:11.5px;color:var(--ink-3)}
.pb.mine.is-err{background:var(--note-bad-bg);box-shadow:inset 0 0 0 1px rgba(255,59,48,.28)}

.pb.old b{font-weight:500;color:var(--ink-2)}

.mh-actions{margin-left:auto;display:flex;gap:8px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:0 2px}
.searchbar{display:flex;align-items:center;gap:4px;flex:1 1 520px;max-width:720px;height:40px;padding:0 4px 0 13px;border-radius:999px;
  background:var(--field-bg);box-shadow:var(--field-shadow);transition:box-shadow .15s}
.searchbar:focus-within{box-shadow:inset 0 0 0 1px rgba(75,151,255,.8),0 0 0 3px rgba(75,151,255,.25)}
.searchbar > svg{flex:none;width:14px;height:14px;color:var(--ink-3)}

.searchbar input[type=search]:focus{box-shadow:none}
.sb-in{flex:none;padding:0 4px 0 12px;border-left:1px solid var(--sep);font-size:12px;color:var(--ink-3)}

.list-head{border-bottom:1px solid var(--line)}

.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,40%) minmax(0,1fr);gap:var(--gap)}

.rr{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px 8px 4px;border:0;border-radius:12px;
  background:none;text-align:left;transition:background .15s}
.rr + .rr{margin-top:1px}
.rr:hover{background:var(--hover)}
.rr.sel{background:var(--accent-soft);box-shadow:var(--accent-ring)}
.rr-pos{padding-top:2px;text-align:right;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rr-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.rr-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-name em{font-weight:400;color:var(--ink-3)}
.rr-target,.rr-hit{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-hit{color:var(--ink-2)}
.rr-hit mark{background:var(--hit);color:inherit;border-radius:3px}
.rr-side{display:flex;align-items:center;gap:7px;padding-top:2px}
.rr-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tag{height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;line-height:18px;background:var(--chip-bg);color:var(--ink-2)}
.tag.amber{background:var(--note-warn-bg);color:var(--note-warn-ink)}
.pin{width:12px;height:12px;color:var(--ink-3)}
.dot{flex:none;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent-2)}
.sev{flex:none;width:8px;height:8px;border-radius:50%}
.sev.error{background:var(--bad);box-shadow:0 0 8px rgba(255,106,95,.55)}
.sev.warning{background:var(--warn);box-shadow:0 0 8px rgba(255,179,64,.55)}
.sev.known{box-shadow:inset 0 0 0 1.5px var(--sep)}
.list-empty{padding:32px 20px;text-align:center;color:var(--ink-2)}

/* ---------- Rule detail ---------- */
.detail-panel{display:flex;min-width:0;min-height:0;overflow:hidden;border-radius:26px}
.detail{flex:1;min-width:0;overflow:auto;padding:22px 24px 18px}
.detail-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-2)}
.d-head{display:flex;align-items:flex-start;gap:12px}
.d-tools{display:flex;gap:6px;flex:none;padding-top:3px}
.d-tools .btn svg{width:14px;height:14px}
.btn.icon.trash{color:var(--note-bad-ink)}
.btn.icon.trash:hover{background:var(--note-bad-bg)}
.d-title{flex:1;min-width:0;display:flex;align-items:center;gap:4px;min-height:38px}
.detail-panel.editing{box-shadow:var(--glass-shadow),inset 0 3px 0 var(--accent-2)}
.edit-zone{margin-left:-14px;margin-right:-14px;padding:14px 14px 4px;border-radius:16px;background:var(--accent-soft);box-shadow:var(--accent-ring)}
.edit-badge{margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;color:#fff;background:var(--accent)}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:0}
.info{min-width:0}
.info.wide{grid-column:1 / -1}
.info dt{margin-bottom:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.info dd{margin:0;font-size:13.5px;word-break:break-all}
.info dd.mono{font-size:12.5px}
.info dd em{font-style:normal;color:var(--ink-3)}
.info dd a{color:var(--link);text-decoration:none}
.info dd a:hover{text-decoration:underline}
.pl.editing{background:var(--accent-soft)}
.pl-ok{color:var(--ok) !important;opacity:1 !important}
.d-name-text{margin:0;min-width:0;font:600 21px/1.25 var(--font-d);letter-spacing:-.005em;word-break:break-word}
.d-name-text em{font-weight:500;color:var(--ink-3)}
.d-edit{flex:none;width:30px;height:30px;color:var(--ink-3)}
.d-edit svg{width:15px;height:15px}
.d-title:hover .d-edit{color:var(--link);background:var(--hover)}
input.d-name{flex:1;height:38px;margin-left:-2px;padding:0 10px;font:600 21px var(--font-d);letter-spacing:-.005em}
input.d-name:focus{background:var(--field-bg);box-shadow:inset 0 0 0 1px rgba(75,151,255,.8),0 0 0 3px rgba(75,151,255,.25)}
.d-head{margin-bottom:16px}
.d-sub{margin:-12px 0 16px;font-size:12.5px;color:var(--ink-3)}
.d-sub:empty{display:none}
.d-section{margin-top:24px}
.d-section h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.d-section h2 .count{font-weight:500;color:var(--ink-3)}

/* the route: vanity paths converging on one address */
.route{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1.15fr);align-items:center;padding:18px;border-radius:20px;
  background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.route-from{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.pchip{max-width:100%;height:30px;padding:0 11px;border-radius:9px;line-height:30px;background:var(--field-bg);box-shadow:var(--field-shadow);
  font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.more{background:none;box-shadow:none;color:var(--ink-3);font-family:var(--font)}
.pchip.none{background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--ink-3);font-family:var(--font)}
.route svg.wires{display:block;width:76px;overflow:visible}
.wires path{fill:none;stroke:var(--accent-2);stroke-width:1.5;opacity:.7}
.wires .head{fill:var(--accent-2);opacity:.9}
.route-to{position:relative;min-width:0;padding:12px 14px;border-radius:15px;overflow:hidden;color:#fff;background:linear-gradient(180deg,#2F86F7,#066FEF 55%,#0560D4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18),0 12px 26px -12px rgba(6,111,239,.8)}
.rt-host{font-size:12px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-path{margin:1px 0 8px;font-family:var(--mono);font-size:13px;font-weight:600;word-break:break-all}
.rt-path.empty{font-family:var(--font);font-weight:400;color:rgba(255,255,255,.75)}
.rt-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11.5px}
.rt-meta span{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.18)}
.route-next{grid-column:3;margin-top:8px;padding:9px 12px;border-radius:13px;font-size:12.5px;color:var(--ink-2);
  background:var(--note-warn-bg);box-shadow:inset 0 0 0 1px rgba(255,179,64,.35)}
.route-next .mono{word-break:break-all;color:var(--ink)}

.problems{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pg-h{display:flex;align-items:baseline;gap:8px;margin:8px 0 0;font-size:12px;font-weight:600;color:var(--ink-2)}
.pg-h:first-child{margin-top:0}
.pg-h span{font-weight:400;color:var(--ink-3)}
.dup-effect{display:block;margin-top:3px}
.problem{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:11px 13px;border-radius:14px}
.problem.error{background:var(--note-bad-bg)}
.problem.warning{background:var(--note-warn-bg)}
.problem.known{background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.problem p{margin:0;font-size:13px;word-break:break-word}
.p-icon{padding-top:1px}
.p-icon svg{width:16px;height:16px}
.problem.error .p-icon{color:var(--bad)}
.problem.warning .p-icon{color:var(--warn)}
.problem.known .p-icon{color:var(--ink-3)}
.p-actions{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.p-actions .link{font-size:12.5px}

.field-row{display:flex;flex-wrap:wrap;gap:0 28px}
.field-row > .field:first-child{min-width:252px}
.field-row.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.ro{display:flex;align-items:center;height:36px;padding:0 11px;border-radius:10px;background:var(--well);color:var(--ink-2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hint.kept{margin:-4px 0 6px}
.sp{display:inline-flex;align-items:center;height:32px}
.sp-current{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 13px;border:0;border-radius:999px;
  background:var(--seg-bg);box-shadow:var(--seg-ring);font-size:13px;color:var(--ink);transition:background .15s}
.sp-current b{font-weight:600}
.sp-current span{color:var(--ink-2)}
.sp-current svg{width:12px;height:12px;color:var(--ink-3);transition:transform .2s var(--ease)}
.sp-current:hover{background:var(--hover-2)}
.sp-current:hover svg{transform:translateX(2px);color:var(--ink-2)}
.sp-current.empty span{color:var(--ink-3)}
.sp-options{display:none}
.sp.open .sp-current{display:none}
.sp.open .sp-options{display:inline-flex;animation:spOut .34s var(--ease)}
@keyframes spOut{from{clip-path:inset(0 100% 0 0 round 999px);opacity:.3}to{clip-path:inset(0 0 0 0 round 999px);opacity:1}}
.switches{margin:4px 0 6px}
details.adv{margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
details.adv summary{padding:2px 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.adv-grid .field:first-child{grid-column:1 / -1}

.paths-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.paths-head h2{margin:0 !important}
.paths-head .search{width:210px;margin-left:auto}
.add-paths{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.add-paths .btn{height:38px}
.selbar{display:flex;align-items:center;gap:4px;margin-bottom:8px;padding:5px 6px 5px 14px;border-radius:14px;background:var(--accent-soft);box-shadow:var(--accent-ring);font-size:13px}
.selbar span{margin-right:auto;font-weight:500}
.path-list{margin:0;padding:0;list-style:none;border-radius:14px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.pl{display:flex;align-items:center;gap:8px;min-height:36px;padding:3px 6px 3px 12px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl input[type=checkbox]{flex:none;width:15px;height:15px;margin:0;accent-color:var(--accent)}
.pl-text{flex:1;min-width:0;padding:4px 6px;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.pl-actions{display:flex;gap:4px;flex:none}
.pl-btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border:0;border-radius:999px;
  background:var(--btn-bg);box-shadow:var(--btn-shadow);font-size:12px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.pl-btn svg{width:12px;height:12px}
.pl-btn:hover{color:var(--ink);background:var(--btn-bg-hover)}
.pl-btn.del{color:var(--note-bad-ink);background:none;box-shadow:none}
.pl-btn.del:hover{background:var(--note-bad-bg);box-shadow:inset 0 0 0 1px rgba(255,59,48,.3)}
.pl-text em{font-family:var(--font);color:var(--ink-3)}
.pl input.pl-edit{flex:1;height:30px;font-family:var(--mono);font-size:12.5px}
.pl .icon-btn{opacity:.55}
.pl .icon-btn svg{width:13px;height:13px}
.pl:hover .icon-btn,.pl .icon-btn:focus-visible{opacity:1}
.d-foot{display:flex;align-items:center;gap:8px;margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.d-foot .note{margin-right:auto;font-size:12.5px;color:var(--ink-3)}
.d-foot .btn.danger{margin-left:auto}

/* ---------- Dialogs ---------- */
dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:26px;color:var(--ink);overflow:visible;
  background:var(--solid-glass);-webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4);box-shadow:var(--glass-shadow)}
dialog::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--glass-rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
dialog::backdrop{background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open]{animation:popIn .26s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.985)}}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 48px);padding:24px 26px 20px}
.dlg h2{margin:0 0 6px;font:600 19px var(--font-d);letter-spacing:-.01em}
.dlg > p{margin:0 0 16px;color:var(--ink-2)}
.dlg-body{margin:0 -26px;padding:4px 26px;overflow:auto}
.dlg-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 8px;margin-top:18px}
.dlg-actions .push{margin-right:auto}
.dlg > p.override{margin:18px -26px 0;padding:12px 26px 0;border-top:1px solid var(--line);font-size:12.5px;text-align:right}
.override .link{color:var(--note-bad-ink)}
.dlg-actions .btn{height:36px;padding:0 16px;font-size:13.5px}
.change-list{margin:0 0 14px;padding:0;list-style:none;border-radius:14px;background:var(--well);box-shadow:inset 0 0 0 1px var(--line)}
.change-list li{padding:9px 13px;border-top:1px solid var(--line);font-size:13px;word-break:break-word}
.change-list li:first-child{border-top:0}
.blocker{margin-bottom:14px;padding:11px 13px;border-radius:12px;background:var(--note-bad-bg);color:var(--note-bad-ink);font-size:13px}
.blocker ul{margin:6px 0 0;padding-left:18px}
.warnnote{margin-bottom:14px;padding:10px 13px;border-radius:12px;background:var(--note-warn-bg);color:var(--note-warn-ink);font-size:13px}
.mv-list{display:flex;flex-direction:column;gap:1px;max-height:46vh;margin-top:10px;overflow:auto}
.mv-list button{padding:7px 10px;border:0;border-radius:11px;background:none;text-align:left}
.mv-list button:hover{background:var(--accent-soft)}
.mv-list small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nr-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.nr-grid .full{grid-column:1 / -1}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:18px;z-index:80;display:flex;align-items:center;gap:12px;max-width:min(600px,calc(100% - 32px));
  padding:8px 8px 8px 16px;border-radius:18px;font-size:13.5px;line-height:1.4;
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.toast[data-kind="error"] .toast-dot{background:var(--bad)}
.toast .btn{height:28px;font-size:12.5px}
.toast a{color:var(--link);font-weight:500}

@media (max-width:1320px){
  .lh-label{display:none}
  .lh-filter .seg button{padding:0 9px}
}
@media (max-width:1180px){
  .split{grid-template-columns:minmax(260px,42%) minmax(0,1fr)}
  .route{grid-template-columns:minmax(0,1fr) 56px minmax(0,1.1fr);padding:14px}
  .route svg.wires{width:56px}
}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh;grid-template-rows:auto minmax(0,1fr)}
  .topbar{flex-wrap:wrap;border-radius:22px;padding:8px 10px;height:auto}
  .split{grid-template-columns:1fr}
  .list-panel{max-height:50vh}
  .mh-actions{width:100%;margin-left:0}
  .brand-sub{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important}
}

</style>
</head>
<body>
<div id="app" class="welcome-mode">
  <header class="topbar glass">
    <div class="brand" aria-label="Veerča, Redirects Editor"><span class="mark" id="brand-mark"></span><span class="brand-text"><span id="brand-word"></span><span class="brand-sub">Redirects Editor</span></span></div>
    <div class="source" id="source"></div>
    <button class="btn icon theme-btn" type="button" data-pref="auto"><svg class="ti-auto" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5.75"/><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor" stroke="none"/></svg><svg class="ti-light" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg><svg class="ti-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.25 9.6A5.75 5.75 0 1 1 6.4 2.75a4.6 4.6 0 0 0 6.85 6.85z"/></svg></button>
  </header>
  <main class="main" id="main"></main>
</div>
<div class="ambient" aria-hidden="true"></div>
<input type="file" id="file-input" accept=".zip,.csv,text/csv,application/zip" hidden>
<div class="toast glass" id="toast" role="status" aria-live="polite"><span class="toast-dot"></span><span id="toast-text"></span><button class="btn" id="toast-close" type="button">Dismiss</button></div>
<script id="core">
(function (root) {
  'use strict';

  const MARKETS = [
    ['United Kingdom', 'www.ford.co.uk'], ['France', 'www.ford.fr'], ['Norway', 'www.ford.no'], ['Germany', 'www.ford.de'],
    ['Ireland', 'www.ford.ie'], ['Belgium (NL)', 'www.nl.ford.be'], ['Belgium (FR)', 'www.fr.ford.be'],
    ['Switzerland (FR)', 'www.fr.ford.ch'], ['Switzerland (DE)', 'www.de.ford.ch'], ['Switzerland (IT)', 'www.it.ford.ch'],
    ['Austria', 'www.ford.at'], ['Czech Republic', 'www.ford.cz'], ['Denmark', 'www.ford.dk'], ['Finland', 'www.ford.fi'],
    ['Greece', 'www.ford.gr'], ['Hungary', 'www.ford.hu'], ['Italy', 'www.ford.it'], ['Netherlands', 'www.ford.nl'],
    ['Poland', 'www.ford.pl'], ['Portugal', 'www.ford.pt'], ['Romania', 'www.ford.ro'], ['Spain', 'www.ford.es'],
    ['Luxembourg', 'www.ford.lu'],
  ].map(([name, host]) => ({ name, host }));

  const STATUS_CODES = [301, 302, 303, 307, 308];
  const STATUS_LABELS = { 301: 'Permanent', 302: 'Temporary', 303: 'See other', 307: 'Temporary, keeps method', 308: 'Permanent, keeps method' };

  // Column names as Akamai and Veera write them, and the field each one fills.
  const COLUMNS = [
    ['ruleName', 'name'], ['host', 'host'], ['path', 'path'], ['query', 'query'], ['scheme', 'scheme'],
    ['matchURL', 'matchURL'], ['regex', 'regex'], ['result.useIncomingQueryString', 'useQueryString'],
    ['result.redirectURL', 'redirectURL'], ['result.statusCode', 'statusCode'],
  ];
  const CSV_HEAD = COLUMNS.map((c) => c[0]);

  const str = (v) => (v == null ? '' : String(v));

  /* ---------- data model ---------- */

  function normalizeRule(r) {
    return {
      id: str(r.id), name: str(r.name), host: str(r.host),
      paths: Array.isArray(r.paths) ? r.paths.map(str) : [],
      redirectURL: str(r.redirectURL), statusCode: Number(r.statusCode) || 0,
      caseSensitive: !!r.caseSensitive, useQueryString: !!r.useQueryString,
      regex: str(r.regex), query: str(r.query), scheme: str(r.scheme), matchURL: str(r.matchURL),
      pinLast: !!r.pinLast, extra: Object.assign({}, r.extra || {}),
    };
  }

  const snapshot = (m) => JSON.stringify(m.rules.map(normalizeRule));
  const exportOrder = (rules) => rules.filter((r) => !r.pinLast).concat(rules.filter((r) => r.pinLast));

  function newId() {
    const bytes = new Uint8Array(12);
    root.crypto.getRandomValues(bytes);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  /* ---------- reading files ---------- */

  function parseCSV(text, delim) {
    const rows = [];
    let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"' && field === '') q = true;
      else if (c === delim) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter((r) => !(r.length === 1 && r[0].trim() === ''));
  }

  function marketForHost(host) {
    const m = MARKETS.find((x) => x.host === host);
    return m ? m.name : '';
  }

  // Reads a policy file: Akamai's export (with its "#" header block) or a CSV exported by Veera.
  function importPolicy(text, fileName) {
    text = text.replace(/^\ufeff/, '');
    const lines = text.split(/\r\n|\n|\r/);
    const meta = {};
    let k = 0;
    while (k < lines.length && (lines[k].startsWith('#') || (k === 0 && !lines[k].trim()))) {
      const m = lines[k].match(/^#\s*([^:]+?)\s*:\s*(.*)$/);
      if (m) meta[m[1]] = m[2].trim();
      k++;
    }
    const headerLine = lines.slice(k).find((l) => l.trim()) || '';
    const delimiter = headerLine.split(';').length > headerLine.split(',').length ? ';' : ',';
    const rows = parseCSV(lines.slice(k).join('\n'), delimiter);
    if (!rows.length) throw new Error('This file is empty.');
    const head = rows[0].map((h) => h.trim());
    for (const need of ['ruleName', 'path', 'result.redirectURL']) {
      if (!head.includes(need)) throw new Error('This doesn\u2019t look like a redirect policy: there\u2019s no \u201c' + need + '\u201d column.');
    }
    const extraCols = head.filter((h) => h && !CSV_HEAD.includes(h));
    const rules = rows.slice(1).map((row, n) => {
      const get = (col) => { const i = head.indexOf(col); return i < 0 ? '' : str(row[i]); };
      let path = get('path');
      const cs = path.startsWith(':');
      if (cs) path = path.slice(1);
      const extra = {};
      for (const c of extraCols) extra[c] = get(c);
      return normalizeRule({
        id: 'r' + (n + 1), name: get('ruleName'), host: get('host'), paths: path === '' ? [] : path.split(' '),
        redirectURL: get('result.redirectURL'), statusCode: get('result.statusCode'), caseSensitive: cs,
        useQueryString: /^(1|true|yes)$/i.test(get('result.useIncomingQueryString').trim()),
        regex: get('regex'), query: get('query'), scheme: get('scheme'), matchURL: get('matchURL'), extra,
      });
    });

    // Veera always exported the first rule named "...trailing slash..." last. Keep doing that.
    const ts = rules.find((r) => r.name.includes('trailing slash'));
    if (ts) ts.pinLast = true;

    const counts = new Map();
    for (const r of rules) for (const h of r.host.trim().split(/\s+/)) if (h) counts.set(h, (counts.get(h) || 0) + 1);
    const known = [...counts.keys()].filter(marketForHost);
    const host = (known.length ? known : [...counts.keys()]).sort((a, b) => counts.get(b) - counts.get(a))[0] || '';
    const policy = meta['Policy'] || str(fileName).replace(/\.(csv|zip)$/i, '');

    return {
      market: { name: marketForHost(host) || policy || host, host, extraCols, rules },
      info: {
        source: Object.keys(meta).length ? 'akamai' : 'csv',
        policy, version: meta['Version'] || '', policyId: meta['Policy ID'] || '',
        description: meta['Description'] || '', lastUpdate: meta['Last Update'] || '',
        delimiter, extraCols, pinnedMoved: !!ts && rules[rules.length - 1] !== ts,
      },
    };
  }

  /* ---------- writing: the same bytes Veera's "Export Policy" produced ---------- */

  function exportCSV(market) {
    const cell = (v) => '"' + str(v).replace(/"/g, '""') + '"';
    const extras = (market.extraCols || []).filter((c) => market.rules.some((r) => str(r.extra[c]) !== ''));
    const rows = [CSV_HEAD.concat(extras)];
    for (const r of exportOrder(market.rules)) {
      const p = r.paths.join(' ');
      rows.push([r.name, r.host, r.caseSensitive ? ':' + p : p, r.query, r.scheme, r.matchURL, r.regex,
        r.useQueryString ? '1' : '', r.redirectURL, String(r.statusCode)].concat(extras.map((c) => r.extra[c])));
    }
    return '\ufeff' + rows.map((row) => row.map(cell).join(',')).join('\n');
  }

  /* ---------- input helpers ---------- */

  function toPath(raw) {
    let s = str(raw).trim();
    if (!s) return '';
    const m = s.match(/^(?:https?:\/\/)?((?:www|[a-z0-9-]+)\.[a-z0-9.-]+\.[a-z]{2,})(\/.*)?$/i);
    if (m && (/^https?:\/\//i.test(s) || /^www\./i.test(s))) s = m[2] || '/';
    if (!s.startsWith('/')) s = '/' + s;
    return s;
  }

  function parseTarget(url) {
    const u = str(url).trim();
    if (!u || /\\\d/.test(u)) return null;
    let m = u.match(/^https?:\/\/([^/?#]+)([^?#]*)/i);
    if (m) return { host: m[1].toLowerCase(), path: m[2] || '/' };
    m = u.match(/^([a-z0-9-]+(?:\.[a-z0-9-]+)+)(\/[^?#]*)?/i);
    if (m && !u.startsWith('/')) return { host: m[1].toLowerCase(), path: m[2] || '/', noScheme: true };
    if (u.startsWith('/')) return { host: null, path: u.split(/[?#]/)[0] };
    return null;
  }

  const GARBLED = /[\u00C3\u0102\u00C2\u0139\u00C4][\u0080-\u00BF\u02C7\u02D8\u02DD\u0141\u0142\u2018\u2019\u201A\u201C\u201D\u201E\u2020\u2021\u2026\u2030\u2039\u203A\u0160\u0161\u015A\u015B\u0164\u0165\u0179\u017A\u017D\u017E]/;
  const hostsOf = (r) => { const h = r.host.trim().toLowerCase(); return h ? h.split(/\s+/) : null; };
  const isPlain = (p) => p.startsWith('/') && !/[*?]/.test(p) && !p.includes('&!');

  function buildIndex(ordered) {
    const idx = new Map();
    ordered.forEach((r, i) => {
      if (r.regex) return;
      const hosts = hostsOf(r);
      for (const p of r.paths) {
        if (!isPlain(p)) continue;
        const k = p.toLowerCase();
        if (!idx.has(k)) idx.set(k, []);
        idx.get(k).push({ i, rule: r, path: p, cs: r.caseSensitive, hosts });
      }
    });
    return idx;
  }

  // Other rules that already contain this path (exactly, or ignoring case unless both
  // rules are case-sensitive), on an overlapping host. Used to stop duplicates as they're added.
  function pathOwners(market, path, rule) {
    const out = [];
    if (!path) return out;
    const lp = path.toLowerCase();
    const rh = hostsOf(rule);
    exportOrder(market.rules).forEach((r, i) => {
      if (r === rule) return;
      const h = hostsOf(r);
      if (rh && h && !rh.some((x) => h.includes(x))) return;
      for (const q of r.paths) {
        if (q === path || (q.toLowerCase() === lp && !(r.caseSensitive && rule.caseSensitive))) { out.push({ rule: r, pos: i + 1, path: q }); return; }
      }
    });
    return out;
  }

  // Two rules are the same when they send visitors to the same address with identical settings.
  // Then the second one adds nothing: its paths could simply live in the first.
  const normTarget = (u) => str(u).trim().replace(/\/+$/, '').toLowerCase();
  function ruleKey(r) {
    return [normTarget(r.redirectURL), r.statusCode, r.caseSensitive, r.useQueryString, r.regex, r.query, r.scheme, r.matchURL,
      r.host.trim().toLowerCase().split(/\s+/).filter(Boolean).sort().join(' ')].join('\u0001');
  }
  function findTwin(market, rule) {
    if (!rule.redirectURL.trim()) return null;
    const k = ruleKey(rule);
    const ordered = exportOrder(market.rules);
    for (let i = 0; i < ordered.length; i++) if (ordered[i] !== rule && ordered[i].id !== rule.id && ruleKey(ordered[i]) === k) return { rule: ordered[i], pos: i + 1 };
    return null;
  }

  /* ---------- checks ---------- */

  function analyze(market) {
    const issues = [];
    const ordered = exportOrder(market.rules);
    const idx = buildIndex(ordered);
    const marketHost = market.host.toLowerCase();
    const knownHosts = new Set([marketHost]);
    ordered.forEach((r) => (hostsOf(r) || []).forEach((h) => knownHosts.add(h)));
    const nameCount = new Map();
    ordered.forEach((r) => { const k = r.name.trim(); if (k) nameCount.set(k, (nameCount.get(k) || 0) + 1); });

    const firstByKey = new Map();
    ordered.forEach((r, i) => { if (r.redirectURL.trim()) { const k = ruleKey(r); if (!firstByKey.has(k)) firstByKey.set(k, { rule: r, pos: i + 1 }); } });

    ordered.forEach((r, i) => {
      const add = (severity, type, message, extra) => {
        extra = extra || {};
        issues.push(Object.assign({ severity, type, ruleId: r.id, message, key: type + '|' + r.id + '|' + str(extra.path) }, extra));
      };

      if (!r.name.trim()) add('error', 'noName', 'Give this rule a name.');
      if (!r.redirectURL.trim()) add('error', 'noTarget', 'Add the address visitors should be sent to.');
      if (!STATUS_CODES.includes(r.statusCode)) add('error', 'status', 'Choose a redirect status code: 301, 302, 303, 307 or 308.');
      if (!r.paths.length) add('error', 'noPaths', 'Add at least one path. A rule without paths could catch every page on the site.');
      for (const [field, label] of [['name', 'rule name'], ['host', 'hosts'], ['redirectURL', 'redirect address'], ['regex', 'regex'], ['query', 'query'], ['scheme', 'scheme'], ['matchURL', 'match URL']]) {
        if (/["\r\n]/.test(r[field])) add('error', 'chars', 'The ' + label + ' contains a quote mark or a line break, which would break the file.', { path: field });
      }
      if (r.name.trim() && nameCount.get(r.name.trim()) > 1) add('warning', 'dupName', 'Another rule in this policy has the same name.');
      const twin = r.redirectURL.trim() && firstByKey.get(ruleKey(r));
      if (twin && twin.rule !== r) {
        add('error', 'dupRule', 'This rule sends visitors to the same address as \u201c' + twin.rule.name + '\u201d (rule ' + twin.pos + '), with the same settings, so it isn\u2019t needed. Its paths belong in that rule.',
          { otherId: twin.rule.id, fix: 'merge' });
      }
      const garbled = [r.redirectURL].concat(r.paths).find((s) => GARBLED.test(s));
      if (garbled) add('warning', 'garbled', garbled + ' contains garbled characters, typical of a file once saved in the wrong encoding. It won\u2019t match the real address.');

      const seen = new Set();
      let empty = 0;
      for (const p of r.paths) {
        if (p === '') { empty++; continue; }
        if (/[\s"]/.test(p)) {
          add('error', 'pathChars', p + ' contains a space, tab or quote mark. Paths are separated by spaces in the file, so it would split in two.', { path: p, fix: 'removePath' });
        } else if (!p.startsWith('/')) {
          add('warning', 'pathSlash', '\u201c' + p + '\u201d doesn\u2019t start with /. It may be the leftover half of a path that contained a space.', { path: p, fix: 'removePath' });
        }
        const k = r.caseSensitive ? p : p.toLowerCase();
        if (seen.has(k)) add('warning', 'pathTwice', p + ' is listed twice in this rule.', { path: p, fix: 'removeDuplicate' });
        seen.add(k);

        if (!r.regex && isPlain(p)) {
          const rh = hostsOf(r);
          for (const e of idx.get(p.toLowerCase()) || []) {
            if (e.i >= i) break;
            const covers = !e.hosts || (rh && rh.every((h) => e.hosts.includes(h)));
            if (!covers) continue;
            if (!e.cs || (r.caseSensitive && e.path === p)) {
              add('error', 'shadowed', p + ' never takes effect: the rule \u201c' + e.rule.name + '\u201d comes earlier and already handles it.',
                { path: p, otherId: e.rule.id, fix: 'removePath' });
              issues.push({ severity: 'warning', type: 'overlap', ruleId: e.rule.id, path: p, otherId: r.id,
                key: 'overlap|' + e.rule.id + '|' + p + '|' + r.id,
                message: p + ' is also listed in \u201c' + r.name + '\u201d further down, where it never takes effect.' });
              break;
            }
          }
        }
      }
      if (empty) add('warning', 'emptyPath', empty === 1 ? 'This rule has an empty path entry.' : 'This rule has ' + empty + ' empty path entries.', { fix: 'removeEmpty' });

      if (r.regex) return;
      const t = parseTarget(r.redirectURL);
      if (t && t.noScheme) {
        add('warning', 'noScheme', 'The redirect address doesn\u2019t start with https://. Depending on how Akamai reads it, visitors could end up on a broken address.', { fix: 'addScheme' });
      } else if (!t && r.redirectURL.trim() && !/\\\d/.test(r.redirectURL)) {
        add('warning', 'oddTarget', 'The redirect address is neither a full address nor a path starting with /.');
      }
      if (!t) return;

      const rh = hostsOf(r);
      const targetHost = t.host || (rh ? rh[0] : marketHost);
      const sameHost = !t.host || (rh ? rh.includes(targetHost) : targetHost === marketHost);
      if (sameHost) {
        const self = r.paths.find((p) => isPlain(p) && (r.caseSensitive ? p === t.path : p.toLowerCase() === t.path.toLowerCase()));
        if (self) add('error', 'loop', self + ' sends visitors to its own address, so they would bounce in a loop.', { path: self, fix: 'removePath' });
      }
      if (!knownHosts.has(targetHost)) return;
      for (const e of idx.get(t.path.toLowerCase()) || []) {
        if (e.rule === r) continue;
        if (e.hosts && !e.hosts.includes(targetHost)) continue;
        if (e.cs && e.path !== t.path) continue;
        const nextTarget = e.rule.redirectURL;
        const canFlatten = !/\\\d/.test(nextTarget) && !!parseTarget(nextTarget);
        add('warning', 'chain', 'Visitors land on ' + t.path + ', which the rule \u201c' + e.rule.name + '\u201d redirects again to ' + nextTarget + '.',
          { otherId: e.rule.id, nextTarget, nextStatus: e.rule.statusCode, fix: canFlatten ? 'flatten' : null });
        break;
      }
    });
    return issues;
  }

  /* ---------- change summaries ---------- */

  const FIELDS = [['name', 'name'], ['redirectURL', 'redirect address'], ['statusCode', 'status code'], ['host', 'hosts'],
    ['caseSensitive', 'case-sensitive'], ['useQueryString', 'keep query string'], ['regex', 'regex'], ['query', 'query'],
    ['scheme', 'scheme'], ['matchURL', 'match URL'], ['pinLast', 'always last']];

  function diffMarket(a, b) {
    const A = new Map(a.rules.map((r) => [r.id, r]));
    const B = new Map(b.rules.map((r) => [r.id, r]));
    const added = exportOrder(b.rules).filter((r) => !A.has(r.id));
    const removed = a.rules.filter((r) => !B.has(r.id));
    const changed = [];
    for (const r of exportOrder(b.rules)) {
      const o = A.get(r.id);
      if (!o) continue;
      const fields = FIELDS.filter(([k]) => o[k] !== r[k]).map(([k, label]) => ({ key: k, label, from: o[k], to: r[k] }));
      const os = new Set(o.paths), ns = new Set(r.paths);
      const pathsAdded = r.paths.filter((p) => !os.has(p));
      const pathsRemoved = o.paths.filter((p) => !ns.has(p));
      const tidied = !pathsAdded.length && !pathsRemoved.length && o.paths.join('\n') !== r.paths.join('\n');
      if (fields.length || pathsAdded.length || pathsRemoved.length || tidied) changed.push({ rule: r, before: o, fields, pathsAdded, pathsRemoved, tidied });
    }
    const oa = exportOrder(a.rules).map((r) => r.id).filter((id) => B.has(id)).join();
    const ob = exportOrder(b.rules).map((r) => r.id).filter((id) => A.has(id)).join();
    return { added, removed, changed, orderChanged: oa !== ob, count: added.length + removed.length + changed.length };
  }

  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const showVal = (v) => (typeof v === 'boolean' ? (v ? 'yes' : 'no') : (v === '' ? '(empty)' : String(v)));
  const showPaths = (ps) => ps.map((p) => (p === '' ? '(empty)' : p)).join(', ');

  function describeDiff(d) {
    const lines = [];
    for (const r of d.added) lines.push('New rule \u201c' + r.name + '\u201d: ' + showPaths(r.paths) + ' \u2192 ' + r.redirectURL + ' (' + r.statusCode + ')');
    for (const c of d.changed) {
      const parts = c.fields.map((f) => f.label + ' changed from ' + showVal(f.from) + ' to ' + showVal(f.to));
      if (c.pathsAdded.length) parts.push('added ' + showPaths(c.pathsAdded));
      if (c.pathsRemoved.length) parts.push('removed ' + showPaths(c.pathsRemoved));
      if (c.tidied) parts.push('tidied the path list');
      lines.push('\u201c' + c.rule.name + '\u201d: ' + parts.join('; '));
    }
    for (const r of d.removed) lines.push('Deleted rule \u201c' + r.name + '\u201d (' + plural(r.paths.length, 'path') + ')');
    if (d.orderChanged) lines.push('Rule order changed');
    const bits = [];
    if (d.added.length) bits.push(plural(d.added.length, 'new rule'));
    if (d.changed.length) bits.push(plural(d.changed.length, 'rule') + ' changed');
    if (d.removed.length) bits.push(plural(d.removed.length, 'rule') + ' deleted');
    return { headline: bits.join(', ') || (d.orderChanged ? 'rule order changed' : 'no changes'), lines };
  }

  root.RedirectCore = {
    MARKETS, STATUS_CODES, STATUS_LABELS, CSV_HEAD, normalizeRule, snapshot, exportOrder, newId,
    parseCSV, importPolicy, exportCSV, toPath, pathOwners, findTwin, parseTarget, analyze, diffMarket, describeDiff, plural,
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

    return '<svg class="wordmark ' + cls + '" viewBox="-3 -13 138 39" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M0 0 9 24 18 0"/><path d="M38 0H25v24h13M25 12h10"/><path d="M58 0H45v24h13M45 12h10"/>' +
      '<path d="M65 24V0h7.5a6 6 0 0 1 0 12H65M71.5 12l7 12"/><path d="M107.2 4.3A12 12 0 1 0 107.2 19.7"/>' +
      '<path class="hacek" d="M93.5 -9.5 98 -5.5 102.5 -9.5" stroke-width="3.4"/><path d="M114 24 123 0 132 24M117.4 15h11.2"/></svg>';
  }

  const STATUS_DESC = {
    301: 'Permanent. Browsers and search engines treat the new address as the page\u2019s real home.',
    302: 'Temporary. The old address stays the page\u2019s real home.',
    303: 'See other. Meant for form submissions; rarely right for vanity URLs.',
    307: 'Temporary, and the browser repeats the request method unchanged.',
    308: 'Permanent, and the browser repeats the request method unchanged.',
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  const state = {
    doc: null, ruleId: null, loadError: '', loading: false, editing: null,
    q: '', scope: 'all', onlyProblems: false, selected: new Set(), pathFilter: '',
  };

  /* ================= the open file ================= */

  function recompute(ms) {
    ms.issues = C.analyze(ms.current);
    ms.byRule = new Map();
    for (const i of ms.issues) {
      i.isNew = !ms.baseline.has(i.key);
      if (!ms.byRule.has(i.ruleId)) ms.byRule.set(i.ruleId, []);
      ms.byRule.get(i.ruleId).push(i);
    }
    ms.dirty = C.snapshot(ms.current) !== ms.originalSnap;
  }

  function openDoc(text, fileName) {
    const { market, info } = C.importPolicy(text, fileName);
    const ms = {
      name: market.name, host: market.host, original: clone(market), current: clone(market),
      originalSnap: C.snapshot(market), exportedSnap: null,
      origById: new Map(market.rules.map((r) => [r.id, JSON.stringify(r)])),
      baseline: new Set(C.analyze(market).map((i) => i.key)), issues: [], byRule: new Map(), dirty: false,
    };
    recompute(ms);
    state.doc = { ms, info, fileName };
    state.editing = null;
    state.ruleId = null; state.q = ''; state.onlyProblems = false; state.selected.clear(); state.pathFilter = '';
    state.loadError = '';
    renderAll();
    const notes = [];
    if (info.delimiter === ';') notes.push('This file uses semicolons, as Excel saves it in some regional settings. The export uses commas, like Veera\u2019s.');
    if (info.extraCols.length) notes.push('Columns the tool doesn\u2019t edit are kept as they are: ' + info.extraCols.join(', ') + '.');
    if (info.pinnedMoved) notes.push('The trailing-slash rule wasn\u2019t last in this file. The export puts it last, as Veera did.');
    if (notes.length) toast(notes.join(' '));
  }

  async function readZip(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    if (eocd < 0) throw new Error('This zip file seems to be damaged.');
    let p = dv.getUint32(eocd + 16, true);
    const count = dv.getUint16(eocd + 10, true);
    for (let n = 0; n < count; n++) {
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      if (!/\.csv$/i.test(name) || /(^|\/)(__MACOSX|\.)/.test(name)) continue;
      const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
      const data = new Uint8Array(buf, start, size);
      if (method === 0) return { name: name.split('/').pop(), bytes: data };
      if (method === 8) {
        const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
        return { name: name.split('/').pop(), bytes: new Uint8Array(out) };
      }
      throw new Error('This zip uses a compression method the tool can\u2019t read. Unzip it and open the CSV instead.');
    }
    throw new Error('There\u2019s no CSV file inside this zip.');
  }

  async function openFile(file, force) {
    if (!file) return;
    if (!force && unexported()) {
      confirmDialog('Open another file?', 'Your changes to ' + state.doc.ms.name + ' haven\u2019t been exported yet. Opening another file discards them.', 'Open file', () => openFile(file, true));
      return;
    }
    state.loading = true; renderAll();
    try {
      let bytes = new Uint8Array(await file.arrayBuffer()), name = file.name;
      if (/\.zip$/i.test(name) || (bytes[0] === 0x50 && bytes[1] === 0x4b)) ({ name, bytes } = await readZip(bytes.buffer));
      else if (/\.xlsx?$/i.test(name)) throw new Error('Excel workbooks can\u2019t be opened directly. In Excel, use Save As and choose \u201cCSV UTF-8\u201d, then open that file.');
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
      catch (e) { throw new Error('This file isn\u2019t saved as UTF-8, so accented characters would come out wrong. In Excel, use Save As and choose \u201cCSV UTF-8\u201d, then open it again.'); }
      state.loading = false;
      openDoc(text, name);
    } catch (e) {
      state.loading = false;
      if (state.doc) { renderAll(); toast(e.message, 'error'); }
      else { state.loadError = e.message; renderAll(); }
    }
  }

  const activeMs = () => (state.doc ? state.doc.ms : null);
  const activeRule = () => { const ms = activeMs(); return ms ? ms.current.rules.find((r) => r.id === state.ruleId) || null : null; };
  const ruleState = (ms, r) => (!ms.origById.has(r.id) ? 'new' : ms.origById.get(r.id) !== JSON.stringify(r) ? 'changed' : 'same');
  const newErrors = (ms) => ms.issues.filter((i) => i.isNew && i.severity === 'error');
  // Text typed but not applied yet counts as work too: paths in the "Add paths" box,
  // a path being edited, or a half-filled New rule form.
  function pendingInput() {
    if (draftChanged()) return true;
    const ta = document.getElementById('add-paths');
    if (ta && ta.value.trim()) return true;
    if (document.querySelector('.pl input.pl-edit')) return true;
    const nr = document.getElementById('nr-form');
    return !!nr && [...nr.querySelectorAll('input[type=text], textarea')].some((i) => i.name !== 'host' && i.value.trim());
  }
  // Checked fresh each time, so a change typed a split second before F5 still counts.
  const unexported = () => {
    const ms = activeMs();
    if (!ms) return false;
    const snap = C.snapshot(ms.current);
    return (snap !== ms.originalSnap && snap !== ms.exportedSnap) || pendingInput();
  };

  /* ================= rendering ================= */

  function renderAll() {
    $('#app').classList.toggle('welcome-mode', !state.doc && !state.loading);
    document.body.classList.toggle('is-welcome', !state.doc && !state.loading);
    document.title = state.doc ? state.doc.ms.name + ' \u2013 Veer\u010da' : 'Veer\u010da \u2013 Redirects Editor';
    renderSource();
    renderMain();
    syncThemeButtons();
  }

  function renderSource() {
    const el = $('#source');
    const d = state.doc;
    if (!d) { el.innerHTML = ''; return; }
    const parts = [];
    if (d.info.source === 'akamai') {
      parts.push('<span class="chip"><b>' + esc(d.info.policy) + '</b>' + (d.info.version ? 'version ' + esc(d.info.version) : '') + '</span>');
    } else parts.push('<span class="chip">' + esc(d.fileName) + '</span>');
    parts.push('<button class="btn" data-action="open-file">Open another file</button>');
    el.innerHTML = parts.join('');
  }

  function renderMain() {
    const main = $('#main');
    if (state.loading) { main.innerHTML = '<div class="center"><p class="loading"><span class="spinner"></span>Reading the file\u2026</p></div>'; return; }
    if (!state.doc) { main.innerHTML = startHTML(); return; }
    main.innerHTML =
      '<section class="market">' +
      '<div class="market-head" id="market-head"></div>' +
      '<div class="toolbar">' +
      '<div class="searchbar">' + ICON.search +
      '<label class="visually-hidden" for="rule-search">Search rules</label><input type="search" id="rule-search" placeholder="Search rules, paths or addresses" value="' + esc(state.q) + '" spellcheck="false">' +
      '<span class="sb-in" id="sb-in">in</span><div class="seg" role="radiogroup" aria-labelledby="sb-in">' +
      [['all', 'Everything'], ['name', 'Names'], ['path', 'Paths'], ['target', 'Addresses']]
        .map(([v, l]) => '<button role="radio" aria-checked="' + (state.scope === v) + '" data-action="scope" data-scope="' + v + '">' + l + '</button>').join('') +
      '</div></div></div>' +
      '<div class="split"><div class="glass list-panel">' +
      '<div class="list-head"><div class="lh-filter"><span class="lh-label" id="lh-show">Show</span><div class="seg" role="radiogroup" aria-labelledby="lh-show">' +
      '<button role="radio" aria-checked="' + !state.onlyProblems + '" data-action="only-problems" data-on="">All rules</button>' +
      '<button role="radio" aria-checked="' + (state.onlyProblems === 'new') + '" data-action="only-problems" data-on="new">Errors from your changes</button>' +
      '<button role="radio" aria-checked="' + (state.onlyProblems === 'known') + '" data-action="only-problems" data-on="known">Errors already in the policy</button>' +
      '</div></div><div class="list-count" id="list-count"></div></div>' +
      '<div class="rule-list" id="rule-list" aria-label="Rules"></div></div>' +
      '<div class="glass-strong detail-panel"><div class="detail" id="detail"></div></div></div></section>';
    renderHead(); renderList(); renderDetail();
  }

  function startHTML() {
    return '<section class="welcome" id="welcome">' +
      '<button class="btn icon theme-btn w-theme" type="button" data-pref="auto">' + $('.topbar .theme-btn').innerHTML + '</button>' +
      '<div class="mark w-mark">' + ICON.mark + '</div>' +
      '<h1 class="visually-hidden">Veer\u010da, Redirects Editor</h1>' +
      wordmark('w-word') +
      '<p class="w-sub">Redirects Editor</p>' +
      '<div class="dropzone" data-action="open-file">' + ICON.tray +
      '<button class="btn primary lg" type="button" data-action="open-file">Select a policy from your computer</button>' +
      '<p class="dz-or">or drag the .zip or .csv file here</p></div>' +
      '<p class="form-msg" role="alert">' + esc(state.loadError) + '</p>' +
      '</section>';
  }



  function renderHead() {
    const ms = activeMs(), el = $('#market-head');
    if (!el) return;
    const rules = ms.current.rules;
    const paths = rules.reduce((n, r) => n + r.paths.length, 0);
    const fresh = ms.issues.filter((i) => i.isNew);
    const freshErr = fresh.some((i) => i.severity === 'error');
    const known = ms.issues.length - fresh.length;
    el.innerHTML =
      '<div class="mh-title"><h1>' + esc(ms.name) + '</h1><a href="https://' + esc(ms.host) + '" target="_blank" rel="noopener">' + esc(ms.host) + '</a>' +
      (state.doc.info.lastUpdate ? '<span class="mh-when">Version last updated ' + esc(fmtDate(state.doc.info.lastUpdate)) + '</span>' : '') + '</div>' +
      '<div class="mh-stats">' +
      '<div class="stat"><b>' + fmt(rules.length) + '</b><span>rules</span></div>' +
      '<div class="stat"><b>' + fmt(paths) + '</b><span>paths</span></div>' +
      '</div>' +
      '<div class="mh-problems" role="group" aria-labelledby="mh-errors"><span class="mh-label" id="mh-errors">Errors</span><div class="pb-row">' +
      '<button class="pb mine ' + (freshErr ? 'is-err' : fresh.length ? 'is-warn' : 'is-ok') + '" data-action="show-problems" data-which="new" ' +
      'title="Problems your edits created. Errors must be fixed before you can export.">' +
      '<span class="pb-icon">' + (freshErr ? ICON.error : fresh.length ? ICON.warning : ICON.check) + '</span>' +
      '<span class="pb-text"><b>' + (fresh.length ? fmt(fresh.length) + ' from your changes' : 'Nothing from your changes') + '</b>' +
      '</span></button>' +
      (known ? '<button class="pb old" data-action="show-problems" data-which="known" ' +
      'title="These were already in the policy when you opened it. They\u2019re shown for information and don\u2019t block exporting.">' +
      '<span class="pb-icon">' + ICON.ring + '</span>' +
      '<span class="pb-text"><b>' + fmt(known) + ' already in the policy</b></span></button>' : '') +
      '</div></div>' +
      '<div class="mh-actions">' +
      '<button class="btn" data-action="new-rule">New rule</button>' +
      '<button class="btn primary" data-action="review"' + (ms.dirty ? '' : ' disabled') + '>Review and export</button>' +
      '</div>';
  }

  function visibleRules() {
    const ms = activeMs();
    let rules = C.exportOrder(ms.current.rules);
    const pos = new Map(rules.map((r, i) => [r.id, i + 1]));
    if (state.onlyProblems === 'new') rules = rules.filter((r) => (ms.byRule.get(r.id) || []).some((i) => i.isNew));
    else if (state.onlyProblems === 'known') rules = rules.filter((r) => (ms.byRule.get(r.id) || []).some((i) => !i.isNew));
    else if (state.onlyProblems) rules = rules.filter((r) => ms.byRule.has(r.id));
    let q = state.q.trim().toLowerCase();
    if (!q) return { rows: rules.map((r) => ({ r })), pos };
    const qPath = q.replace(/^https?:\/\/[^/]+/, '').replace(/^www\.[^/]+/, '') || q;
    const rows = [];
    for (const r of rules) {
      let hit = false, pathHit = null;
      if ((state.scope === 'all' || state.scope === 'name') && r.name.toLowerCase().includes(q)) hit = true;
      if ((state.scope === 'all' || state.scope === 'target') && r.redirectURL.toLowerCase().includes(q)) hit = true;
      if (state.scope === 'all' || state.scope === 'path') {
        const p = r.paths.find((x) => x.toLowerCase().includes(qPath));
        if (p) { hit = true; pathHit = p; }
      }
      if (hit) rows.push({ r, pathHit, qPath });
    }
    return { rows, pos };
  }

  function shortTarget(r, ms) {
    const t = C.parseTarget(r.redirectURL);
    if (!r.redirectURL) return 'No redirect address yet';
    if (t && t.host && (t.host === ms.host.toLowerCase() || r.host.toLowerCase().split(/\s+/).includes(t.host))) return t.path + r.redirectURL.replace(/^[^?#]*/, '');
    return r.redirectURL;
  }

  function highlight(text, q) {
    const i = text.toLowerCase().indexOf(q);
    if (i < 0 || !q) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function renderList() {
    const ms = activeMs(), el = $('#rule-list');
    if (!el) return;
    const { rows, pos } = visibleRules();
    const total = ms.current.rules.length;
    $('#list-count').textContent = rows.length === total ? fmt(total) + ' rules, in the order Akamai checks them' : fmt(rows.length) + ' of ' + fmt(total) + ' rules';
    if (!rows.length) {
      el.innerHTML = '<p class="list-empty">' + (state.q ? 'No rules match. Try searching everything, or clear the search.'
        : state.onlyProblems === 'new' ? 'Nothing from your changes. Everything you\u2019ve edited checks out.'
        : state.onlyProblems === 'known' ? 'This policy had no problems when you opened it.' : 'No rules.') + '</p>';
      return;
    }
    const top = el.scrollTop;
    el.innerHTML = rows.map(({ r, pathHit, qPath }) => {
      const iss = ms.byRule.get(r.id) || [];
      const fresh = iss.filter((i) => i.isNew);
      const sev = fresh.some((i) => i.severity === 'error') ? 'error' : fresh.length ? 'warning' : iss.length ? 'known' : '';
      const st = ruleState(ms, r);
      return '<button class="rr' + (r.id === state.ruleId ? ' sel' : '') + '" data-action="select-rule" data-id="' + esc(r.id) + '"' + (r.id === state.ruleId ? ' aria-current="true"' : '') + '>' +
        '<span class="rr-pos">' + pos.get(r.id) + '</span>' +
        '<span class="rr-main"><span class="rr-name">' + (r.name ? esc(r.name) : '<em>Unnamed rule</em>') + '</span>' +
        '<span class="rr-target">' + esc(shortTarget(r, ms)) + '</span>' +
        (pathHit ? '<span class="rr-hit">' + highlight(pathHit, qPath) + '</span>' : '') + '</span>' +
        '<span class="rr-side">' +
        (r.statusCode !== 301 ? '<span class="tag' + (C.STATUS_CODES.includes(r.statusCode) ? '' : ' amber') + '">' + (r.statusCode || '?') + '</span>' : '') +
        (r.pinLast ? ICON.pin : '') +
        '<span class="rr-count" title="Paths">' + r.paths.length + '</span>' +
        (st !== 'same' ? '<span class="dot" title="' + (st === 'new' ? 'New rule' : 'Changed') + '"></span>' : '') +
        (sev ? '<span class="sev ' + sev + '" title="' + (sev === 'known' ? 'Has problems that were already in the policy' : 'Has problems from your changes') + '"></span>' : '') +
        '</span></button>';
    }).join('');
    el.scrollTop = top;
  }

  function renderDetail() {
    const ms = activeMs(), el = $('#detail');
    if (!el) return;
    const r = activeRule();
    const panel = el.closest('.detail-panel');
    if (!r) {
      if (panel) panel.classList.remove('editing');
      el.innerHTML = '<div class="detail-empty"><p>Select a rule to see where it sends visitors.</p></div>';
      return;
    }
    const editing = !!state.editing && state.editing.ruleId === r.id;
    if (panel) panel.classList.toggle('editing', editing);
    const ordered = C.exportOrder(ms.current.rules);
    const pos = ordered.indexOf(r) + 1;
    el.innerHTML =
      '<div class="d-head"><div class="d-title" id="d-title">' + titleHTML(r, editing) + '</div><div class="d-tools">' + toolsHTML(editing) + '</div></div>' +
      '<div class="d-sub" id="d-sub">' + subLine(r, pos, ordered.length) + '</div>' +
      '<div id="d-route">' + routeHTML(r) + '</div>' +
      '<div id="d-problems">' + problemsHTML(r) + '</div>' +
      '<div class="d-section' + (editing ? ' edit-zone' : '') + '" id="d-fields"><h2>Redirect' + (editing ? '<span class="edit-badge">Editing</span>' : '') + '</h2>' +
      (editing ? fieldsHTML(state.editing.draft) : infoHTML(r)) + '</div>' +
      '<div class="d-section" id="d-paths">' + pathsHTML(r) + '</div>' +
      '<div class="d-foot" id="d-foot">' + footHTML(r) + '</div>';
    if (editing && state.editing.focus) {
      const f = el.querySelector('[data-draft="' + state.editing.focus + '"]');
      state.editing.focus = null;
      if (f) { f.focus(); f.select(); }
    }
  }


  function titleHTML(r, editing) {
    if (editing) return '<input type="text" class="d-name" data-draft="name" value="' + esc(state.editing.draft.name) + '" placeholder="Rule name" aria-label="Rule name" spellcheck="false">';
    return '<h2 class="d-name-text">' + (r.name ? esc(r.name) : '<em>Unnamed rule</em>') + '</h2>';
  }

  function toolsHTML(editing) {
    if (editing) return '<button class="btn" data-action="cancel-edit">Cancel</button><button class="btn primary" data-action="save-edit">Save</button>';
    return '<button class="btn" data-action="edit-rule" data-focus="name">' + ICON.pencil + 'Edit</button>';
  }

  /* ---- editing a rule: changes go into a draft and only apply on Save ---- */
  const DRAFT_FIELDS = ['name', 'redirectURL', 'statusCode', 'useQueryString', 'caseSensitive', 'regex'];
  function startEdit(focus) {
    const r = activeRule();
    if (!r) return;
    if (!state.editing || state.editing.ruleId !== r.id) {
      const draft = {};
      for (const k of DRAFT_FIELDS) draft[k] = r[k];
      state.editing = { ruleId: r.id, draft };
    }
    state.editing.focus = focus || 'name';
    renderDetail();
  }
  function draftChanged() {
    const e = state.editing;
    if (!e) return false;
    const r = activeMs() && activeMs().current.rules.find((x) => x.id === e.ruleId);
    return !!r && DRAFT_FIELDS.some((k) => (typeof r[k] === 'string' ? r[k].trim() : r[k]) !== (typeof e.draft[k] === 'string' ? e.draft[k].trim() : e.draft[k]));
  }
  function renderEditFields() {
    const box = $('#d-fields');
    if (box && state.editing) box.innerHTML = '<h2>Redirect<span class="edit-badge">Editing</span></h2>' + fieldsHTML(state.editing.draft);
  }
  function cancelEdit() { state.editing = null; renderDetail(); }

  function saveEdit(force) {
    const ms = activeMs(), e = state.editing;
    const r = e && ms.current.rules.find((x) => x.id === e.ruleId);
    if (!r) { state.editing = null; renderDetail(); return; }
    const d = Object.assign({}, e.draft, { name: e.draft.name.trim(), redirectURL: e.draft.redirectURL.trim(), regex: e.draft.regex.trim() });
    const candidate = Object.assign(clone(r), d);
    const twin = C.findTwin(ms.current, candidate);
    if (twin) {
      openDialog('<h2>This would duplicate an existing rule</h2>' +
        '<p>\u201c' + esc(twin.rule.name || 'Unnamed rule') + '\u201d (rule ' + twin.pos + ') already sends visitors to <span class="mono">' + esc(twin.rule.redirectURL) +
        '</span> with the same settings. Instead of keeping two identical rules, move this rule\u2019s paths there.</p>' +
        '<div class="dlg-actions"><button class="btn" data-close>Keep editing</button><button class="btn primary" id="tw-merge">Move the paths there and delete this rule</button></div>',
      (dlg) => {
        $('#tw-merge', dlg).addEventListener('click', () => {
          dlg.close();
          state.editing = null;
          let moved = 0;
          for (const p of r.paths) if (!twin.rule.paths.includes(p)) { twin.rule.paths.push(p); moved++; }
          ms.current.rules = ms.current.rules.filter((x) => x !== r);
          state.ruleId = twin.rule.id;
          changed();
          selectRule(twin.rule.id);
          toast('Moved ' + C.plural(moved, 'path') + ' into \u201c' + (twin.rule.name || 'Unnamed rule') + '\u201d and deleted \u201c' + (r.name || 'Unnamed rule') + '\u201d.');
        });
      });
      return;
    }
    const clash = d.name && d.name.toLowerCase() !== r.name.trim().toLowerCase() &&
      ms.current.rules.find((x) => x !== r && x.name.trim().toLowerCase() === d.name.toLowerCase());
    if (clash && !force) {
      openDialog('<h2>A rule with this name already exists</h2>' +
        '<p>\u201c' + esc(clash.name) + '\u201d already uses this name. Two rules with the same name are easy to mix up.</p>' +
        '<div class="dlg-actions"><button class="btn primary" data-close>Keep editing</button></div>' +
        '<p class="override"><button class="link" id="nm-force">I know what I\u2019m doing, save anyway</button></p>',
      (dlg) => { $('#nm-force', dlg).addEventListener('click', () => { dlg.close(); saveEdit(true); }); });
      return;
    }
    for (const k of DRAFT_FIELDS) r[k] = d[k];
    state.editing = null;
    changed(true);
    toast('Rule updated.');
  }




  function subLine(r, pos, total) {
    return r.pinLast ? 'Always checked last, after every other rule' : '';
  }

  function routeHTML(r) {
    const ms = activeMs();
    const ps = r.paths.filter((p) => p !== '');
    const shown = ps.length > 4 ? ps.slice(0, 3) : ps;
    const more = ps.length - shown.length;
    const chips = shown.map((p) => '<span class="pchip" title="' + esc(p) + '">' + esc(p) + '</span>');
    if (more) chips.push('<span class="pchip more">and ' + fmt(more) + ' more</span>');
    if (!chips.length) chips.push('<span class="pchip none">No paths yet</span>');
    const n = chips.length, rowH = 30, gap = 6, H = n * rowH + (n - 1) * gap, W = 76;
    const wires = chips.map((_, k) => {
      const y = k * (rowH + gap) + rowH / 2;
      return '<path d="M0 ' + y + ' C' + W * 0.5 + ' ' + y + ' ' + W * 0.45 + ' ' + H / 2 + ' ' + (W - 8) + ' ' + H / 2 + '"/>';
    }).join('');
    const svg = '<svg class="wires" viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" preserveAspectRatio="none" aria-hidden="true">' + wires +
      '<path class="head" d="M' + (W - 9) + ' ' + (H / 2 - 4.5) + ' L' + W + ' ' + H / 2 + ' L' + (W - 9) + ' ' + (H / 2 + 4.5) + 'Z"/></svg>';

    const t = C.parseTarget(r.redirectURL);
    let host, path, empty = false;
    if (r.regex) { host = 'Built from the pattern ' + r.regex; path = r.redirectURL || 'No address yet'; }
    else if (!r.redirectURL) { host = ''; path = 'No redirect address yet'; empty = true; }
    else if (t && t.host) { host = t.host; path = r.redirectURL.replace(/^(https?:\/\/)?[^/?#]+/i, '') || '/'; }
    else { host = t ? 'Same site' : ''; path = r.redirectURL; }
    const meta = [];
    meta.push(C.STATUS_CODES.includes(r.statusCode) ? r.statusCode + ' ' + C.STATUS_LABELS[r.statusCode] : 'No valid status code');
    meta.push(r.useQueryString ? 'Keeps query string' : 'Drops query string');
    if (r.caseSensitive) meta.push('Case-sensitive');
    const chain = (ms.byRule.get(r.id) || []).find((i) => i.type === 'chain');
    const next = chain
      ? '<div class="route-next">Then ' + esc(chain.nextStatus) + ' again to <span class="mono">' + esc(chain.nextTarget) + '</span>, by <button class="link" data-action="select-rule" data-id="' + esc(chain.otherId) + '">' + esc(ruleName(chain.otherId)) + '</button></div>'
      : '';
    return '<div class="route" aria-label="Where this rule sends visitors">' +
      '<div class="route-from">' + chips.join('') + '</div>' + svg +
      '<div class="route-to"><div class="rt-host">' + esc(host) + '</div><div class="rt-path' + (empty ? ' empty' : '') + '">' + esc(path) + '</div>' +
      '<div class="rt-meta">' + meta.map((m) => '<span>' + esc(m) + '</span>').join('') + '</div></div>' + next + '</div>';
  }

  function ruleName(id) {
    const r = activeMs().current.rules.find((x) => x.id === id);
    return r ? (r.name || 'Unnamed rule') : 'another rule';
  }

  const FIX_LABEL = {
    removePath: 'Remove this path', removeDuplicate: 'Remove the duplicate', removeEmpty: 'Remove empty entries',
    addScheme: 'Add https://', flatten: 'Send visitors straight to the final address',
    merge: 'Move its paths there and delete this rule',
  };

  function problemsHTML(r) {
    const ms = activeMs();
    const bySev = (a, b) => (a.severity === 'error' ? 0 : 1) - (b.severity === 'error' ? 0 : 1);
    const all = ms.byRule.get(r.id) || [];
    const mine = all.filter((i) => i.isNew).sort(bySev), old = all.filter((i) => !i.isNew).sort(bySev);
    if (!all.length) return '';
    const card = (i) => {
      const actions = [];
      if (i.fix) actions.push('<button class="link" data-action="fix" data-key="' + esc(i.key) + '">' + FIX_LABEL[i.fix] + '</button>');
      if (i.otherId && i.type !== 'chain') actions.push('<button class="link" data-action="select-rule" data-id="' + esc(i.otherId) + '">Open \u201c' + esc(ruleName(i.otherId)) + '\u201d</button>');
      return '<div class="problem ' + i.severity + (i.isNew ? '' : ' known') + '"><span class="p-icon">' + ICON[i.severity] + '</span><div>' +
        '<p>' + esc(i.message) + '</p>' + (actions.length ? '<div class="p-actions">' + actions.join('') + '</div>' : '') + '</div></div>';
    };

      '<div class="seg sp-options" role="radiogroup" aria-label="Status code">' +

        ' data-code="' + c + '" title="' + esc(c + ' ' + C.STATUS_LABELS[c] + '. ' + STATUS_DESC[c]) + '">' + c + '</button>').join('') +

  function infoHTML(r) {

      '<div class="info"><dt>Use query string</dt><dd>' + yn(r.useQueryString) + '</dd></div>' +
      '<div class="info"><dt>Case sensitive</dt><dd>' + yn(r.caseSensitive) + '</dd></div>' +

  function fieldsHTML(r) {
    const ms = activeMs();
    const kept = [];
    return '<label class="field"><span>Redirect URL</span><input type="text" class="mono" data-draft="redirectURL" value="' + esc(r.redirectURL) + '" placeholder="https://' + esc(ms.host) + '/\u2026" spellcheck="false"></label>' +

      '<div class="field"><span>Use query string</span>' + ynSeg('useQueryString', r.useQueryString) + '</div>' +
      '<div class="field"><span>Case sensitive</span>' + ynSeg('caseSensitive', r.caseSensitive) + '</div>' +
      '</div>' +
      '<div class="field-row two">' +
      '<label class="field"><span>Regex</span><input type="text" class="mono" data-draft="regex" value="' + esc(r.regex) + '" placeholder="None" spellcheck="false"></label>' +
      '<div class="field"><span>Host</span><div class="ro mono" title="' + esc(activeRule().host) + '">' + (activeRule().host ? esc(activeRule().host) : 'Every host') + '</div></div>' +
