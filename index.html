<style>
  :root {
    color-scheme: light dark;
    --stage:#E3E4E7; --ink:#1D1D1F; --ink-2:rgba(29,29,31,.66); --accent:#0A63D6;
    --frame-line:rgba(0,0,0,.26); --frame-bg:rgba(255,255,255,.38);
    --ambient:
      radial-gradient(42% 46% at 22% 22%,rgba(6,111,239,.16),transparent 70%),
      radial-gradient(46% 50% at 82% 84%,rgba(120,160,255,.22),transparent 72%),
      radial-gradient(30% 32% at 70% 18%,rgba(90,200,230,.16),transparent 70%);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI Variable Text","Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --stage:#1C1D21; --ink:#F4F6FA; --ink-2:rgba(236,240,247,.68); --accent:#4B97FF;
      --frame-line:rgba(255,255,255,.32); --frame-bg:rgba(255,255,255,.055);
      --ambient:
        radial-gradient(42% 46% at 22% 22%,rgba(6,111,239,.34),transparent 70%),
        radial-gradient(46% 50% at 82% 84%,rgba(0,24,120,.6),transparent 72%),
        radial-gradient(30% 32% at 70% 18%,rgba(70,190,230,.14),transparent 70%);
    }
  }

  * { box-sizing:border-box; }
  html { height:100%; }
  body {
    margin:0; min-height:100%; min-height:100dvh;
    background:var(--ambient), var(--stage); background-attachment:fixed;
    color:var(--ink); font:16px/1.45 var(--font);
    display:grid; place-items:center; padding:2rem 1.5rem;
    -webkit-font-smoothing:antialiased;
  }
  main { text-align:center; width:100%; max-width:26rem; }
  .frame {
    border:2px solid var(--frame-line); border-radius:24px; background:var(--frame-bg);
    padding:clamp(2rem,9vw,3rem) 1.5rem clamp(1.8rem,8vw,2.6rem);
  }
  .mark {
    display:block; width:96px; height:96px; margin:0 auto 24px;
    filter:drop-shadow(0 16px 28px rgba(6,111,239,.42)) drop-shadow(0 2px 4px rgba(0,0,0,.2));
    -webkit-user-drag:none; user-select:none;
  }
  h1 { margin:0; font-size:1.55rem; font-weight:600; letter-spacing:-.01em; }
  .count { margin:.7rem 0 0; color:var(--ink-2); font-size:1.05rem; }
  .count b { display:inline-block; min-width:1ch; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .go { margin:1.5rem 0 0; font-size:.95rem; color:var(--ink-2); }
  .go a { color:var(--accent); text-decoration:underline; text-underline-offset:.2em; text-decoration-thickness:1px; }
  .go a:hover { text-decoration-thickness:2px; }
  .go a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:3px; }
</style>

      if (n > 0) { num.textContent = n; return; }
      clearInterval(timer);
      document.getElementById("count").textContent = "Redirecting\u2026";
      location.replace(target);
    }, 1000);
  })();
  </script>
